<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل حرفي جديد - منصة حرفي</title>
    <!-- مكتبة EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
       (function(){
          emailjs.init({
            publicKey: "1YVvuqYAcvu8EWWaS",
          });
       })();
    </script>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #218838; }
        .hidden { display: none; }
        .msg { text-align: center; margin-top: 15px; color: #666; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <!-- قسم التسجيل الأساسي -->
    <div id="signup-section">
        <h2>إنشاء حساب حرفي</h2>
        <input type="text" id="craftsman-name" placeholder="الاسم الكامل أو اسم الورشة" required>
        <input type="email" id="signup-email" placeholder="البريد الإلكتروني" required>
        <input type="password" id="signup-password" placeholder="كلمة المرور" required>
        <button onclick="registerCraftsman()">تسجيل وإرسال رمز التحقق</button>
    </div>

    <!-- قسم إدخال رمز التحقق (يختفي حتى يتم التسجيل) -->
    <div id="verify-section" class="hidden">
        <h2>التحقق من البريد الإلكتروني</h2>
        <p class="msg">تم إرسال رمز التحقق (OTP) إلى بريدك الإلكتروني. أدخله أدناه:</p>
        <input type="text" id="verification-code" placeholder="أدخل الرمز المكون من أرقام">
        <button onclick="verifyEmailCode()">تأكيد الرمز</button>
    </div>
</div>

<script>
    let userEmail = '';
    let generatedOtp = '';
    let artisanName = '';

    // الخطوة 1: توليد وإرسال رمز التحقق عبر EmailJS
    function registerCraftsman() {
        artisanName = document.getElementById('craftsman-name').value;
        userEmail = document.getElementById('signup-email').value;
        const password = document.getElementById('signup-password').value;

        if (!artisanName || !userEmail || !password) {
            alert('الرجاء ملء جميع الحقول المطلوبة');
            return;
        }

        // توليد رمز تحقق عشوائي من 4 أرقام
        generatedOtp = Math.floor(100000 + Math.random() * 900000).toString();

        const templateParams = {
            to_email: userEmail,
            otp_code: generatedOtp,
            to_name: artisanName
        };

        // إرسال البريد الإلكتروني باستخدام Service ID و Template ID الخاص بك
        emailjs.send('service_in25o7y', 'template_o73g9ys', templateParams)
            .then(function(response) {
               console.log('تم إرسال البريد بنجاح!', response.status, response.text);
               alert('تم إرسال رمز التحقق إلى بريدك الإلكتروني بنجاح.');
               
               // الانتقال لواجهة إدخال الرمز
               document.getElementById('signup-section').classList.add('hidden');
               document.getElementById('verify-section').classList.remove('hidden');
            }, function(error) {
               console.log('فشل إرسال البريد:', error);
               alert('حدث خطأ أثناء إرسال البريد الإلكتروني، يرجى المحاولة لاحقا.');
            });
    }

    // الخطوة 2: التحقق من الرمز المدخل مقارنة بالرمز المرسل
    function verifyEmailCode() {
        const enteredToken = document.getElementById('verification-code').value;

        if (!enteredToken) {
            alert('الرجاء إدخال رمز التحقق');
            return;
        }

        if (enteredToken.trim() === generatedOtp) {
            alert('تم تأكيد بريدك الإلكتروني بنجاح! حسابك الآن بانتظار مراجعة وموافقة الإدارة لكي يظهر في المنصة.');
            
            // يمكنك هنا حفظ بيانات الحرفي محلياً أو إرسالها لقاعدة البيانات الخاصة بك
            localStorage.setItem('approved_artisan', JSON.stringify({ name: artisanName, email: userEmail }));
            
            window.location.href = 'index.html'; // العودة للرئيسية
        } else {
            alert('رمز التحقق غير صحيح، يرجى إعادة المحاولة.');
        }
    }
</script>

</body>
</html>
