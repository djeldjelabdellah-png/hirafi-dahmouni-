// نموذج التسجيل مع خيار التحقق والكود المدمج
function RegisterForm({ onBack, onSubmit, saving, uploadingText, t, lang }) {
  const [step, setStep] = useState(1); // 1: ملء البيانات، 2: إدخال كود التحقق OTP
  const [formData, setFormData] = useState({
    name: "", cat: CATEGORIES[0].id, otherCat: "", hood: NEIGHBORHOODS[0].ar,
    exp: 1, phone: "", bio: "", files: [], email: "", password: ""
  });
  const [verificationCode, setVerificationCode] = useState("");
  const [errorMsg, setErrorMsg] = useState("");

  const handleFileChange = (e) => {
    setFormData({ ...formData, files: Array.from(e.target.files) });
  };

  const handleInitialSubmit = async (e) => {
    e.preventDefault();
    if (!formData.name.trim() || !formData.phone.trim() || !formData.bio.trim() || !formData.email.trim() || !formData.password.trim()) {
      setErrorMsg(t.requiredError);
      return;
    }
    if (formData.cat === "other" && !formData.otherCat.trim()) {
      setErrorMsg(t.otherCraftError);
      return;
    }
    setErrorMsg("");

    // إرسال طلب إنشاء الحساب الأولي مع إرسال الكود للإيميل عبر Supabase Auth
    const { error } = await supabase.auth.signUp({
      email: formData.email,
      password: formData.password,
      options: { data: { full_name: formData.name } }
    });

    if (error) {
      setErrorMsg('خطأ في التسجيل: ' + error.message);
    } else {
      setStep(2); // الانتقال لخطوة إدخال كود التحقق
    }
  };

  const handleVerifyAndComplete = async (e) => {
    e.preventDefault();
    if (!verificationCode) {
      setErrorMsg('الرجاء إدخال رمز التحقق');
      return;
    }
    setErrorMsg("");

    const { error } = await supabase.auth.verifyOtp({
      email: formData.email,
      token: verificationCode,
      type: 'signup'
    });

    if (error) {
      setErrorMsg('الرمز غير صحيح أو انتهت صلاحيته: ' + error.message);
    } else {
      // بعد نجاح التحقق، يتم إرسال البيانات النهائية للمنصة وقاعدة البيانات الرئيسية
      onSubmit(formData);
    }
  };

  return (
    <main className="px-4 pb-24 pt-4">
      <div className="flex items-center gap-2 mb-4">
        <button onClick={onBack} className="text-[#123B3B]">{lang === "ar" ? "←" : "→"}</button>
        <h2 className="font-black text-[#123B3B] text-base">{t.registerTitle}</h2>
      </div>

      {errorMsg && (
        <div className="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-xl mb-4 text-xs font-bold">
          {errorMsg}
        </div>
      )}

      {step === 1 ? (
        <form onSubmit={handleInitialSubmit} className="bg-white rounded-2xl p-5 border shadow-sm space-y-4" style={{ borderColor: "#E6E0D2" }}>
          <div>
            <label className="block text-xs font-bold text-stone-700 mb-1">{t.fullName}</label>
            <input type="text" value={formData.name} onChange={(e) => setFormData({...formData, name: e.target.value})} className="w-full border rounded-xl px-3 py-2.5 text-sm outline-none" style={{ borderColor: "#DCD5C4" }} required />
          </div>

          <div>
            <label className="block text-xs font-bold text-stone-700 mb-1">البريد الإلكتروني (لتأكيد الحساب)</label>
            <input type="email" value={formData.email} onChange={(e) => setFormData({...formData, email: e.target.value})} className="w-full border rounded-xl px-3 py-2.5 text-sm outline-none" style={{ borderColor: "#DCD5C4" }} required />
          </div>

          <div>
            <label className="block text-xs font-bold text-stone-700 mb-1">كلمة المرور</label>
            <input type="password" value={formData.password} onChange={(e) => setFormData({...formData, password: e.target.value})} className="w-full border rounded-xl px-3 py-2.5 text-sm outline-none" style={{ borderColor: "#DCD5C4" }} required />
          </div>

          <div>
            <label className="block text-xs font-bold text-stone-700 mb-1">{t.craft}</label>
            <select value={formData.cat} onChange={(e) => setFormData({...formData, cat: e.target.value})} className="w-full border rounded-xl px-3 py-2.5 text-sm outline-none bg-white" style={{ borderColor: "#DCD5C4" }}>
              {CATEGORIES.map(c => <option key={c.id} value={c.id}>{c.name[lang]}</option>)}
            </select>
          </div>

          {formData.cat === "other" && (
            <div>
              <label className="block text-xs font-bold text-stone-700 mb-1">{t.otherCraft}</label>
              <input type="text" value={formData.otherCat} onChange={(e) => setFormData({...formData, otherCat: e.target.value})} className="w-full border rounded-xl px-3 py-2.5 text-sm outline-none" style={{ borderColor: "#DCD5C4" }} />
            </div>

          <div>
            <label className="block text-xs font-bold text-stone-700 mb-1">{t.neighborhood}</label>
            <select value={formData.hood} onChange={(e) => setFormData({...formData, hood: e.target.value})} className="w-full border rounded-xl px-3 py-2.5 text-sm outline-none bg-white" style={{ borderColor: "#DCD5C4" }}>

          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="block text-xs font-bold text-stone-700 mb-1">{t.experience} (سنوات)</label>
              <input type="number" min="1" max="50" value={formData.exp} onChange={(e) => setFormData({...formData, exp: Number(e.target.value)})} className="w-full border rounded-xl px-3 py-2.5 text-sm outline-none" style={{ borderColor: "#DCD5C4" }} />

            <div>

              <input type="tel" value={formData.phone} onChange={(e) => setFormData({...formData, phone: e.target.value})} className="w-full border rounded-xl px-3 py-2.5 text-sm outline-none" style={{ borderColor: "#DCD5C4" }} placeholder="0550123456" required />

          <div>
            <label className="block text-xs font-bold text-stone-700 mb-1">{t.bio}</label>
            <textarea value={formData.bio} onChange={(e) => setFormData({...formData, bio: e.target.value})} rows="3" className="w-full border rounded-xl px-3 py-2.5 text-sm outline-none" style={{ borderColor: "#DCD5C4" }} required></textarea>
          </div>

          <div>
            <label className="block text-xs font-bold text-stone-700 mb-1">{t.chooseImages}</label>
            <input type="file" multiple accept="image/*" onChange={handleFileChange} className="w-full text-xs text-stone-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-[#123B3B] file:text-white hover:file:bg-[#1B4B4B]" />
            <p className="text-[10px] text-stone-400 mt-1">{t.galleryNote}</p>
          </div>

          <p className="text-[11px] text-stone-500 bg-[#F9F8F6] p-3 rounded-xl">{t.reviewNote}</p>

          <button type="submit" disabled={saving} className="w-full py-3 rounded-xl font-black text-white text-sm transition" style={{ background: "#D9A441" }}>
            {saving ? (uploadingText || t.submitting) : "متابعة وإرسال كود التحقق"}
          </button>
        </form>
      ) : (
        <form onSubmit={handleVerifyAndComplete} className="bg-white rounded-2xl p-5 border shadow-sm space-y-4" style={{ borderColor: "#E6E0D2" }}>
          <div className="text-center">
            <h3 className="font-black text-[#123B3B] text-base mb-1">التحقق من البريد الإلكتروني</h3>
            <p className="text-xs text-stone-500">تم إرسال رمز التحقق إلى بريدك ({formData.email}). أدخله أدناه:</p>

          </div>

          <button type="submit" disabled={saving} className="w-full py-3 rounded-xl font-black text-white text-sm transition" style={{ background: "#28a745" }}>
            {saving ? (uploadingText || t.submitting) : "تأكيد الرمز وإتمام التسجيل"}
          </button>
        </form>
      )}
    </main>
  );
}

function App() {
  const [lang, setLang] = useState("ar");
  const t = STRINGS[lang];
  const dir = lang === "ar" ? "rtl" : "ltr";

  const [list, setList] = useState(null);
  const [query, setQuery] = useState("");
  const [activeCat, setActiveCat] = useState(null);
  const [activeHood, setActiveHood] = useState(t.all);
  const [selected, setSelected] = useState(null);
  const [comments, setComments] = useState([]);
  const [loadingComments, setLoadingComments] = useState(false);
  const [newComment, setNewComment] = useState({ name: "", text: "", rating: 5 });
  const [view, setView] = useState("home");
  const [toast, setToast] = useState(null);
  const [saving, setSaving] = useState(false);
  const [uploadingText, setUploadingText] = useState("");
  const [adminUnlocked, setAdminUnlocked] = useState(false);
  const [pinInput, setPinInput] = useState("");
  const [pinError, setPinError] = useState(false);

  useEffect(() => { setActiveHood(t.all); }, [lang]);
  useEffect(() => { document.documentElement.setAttribute("dir", dir); document.documentElement.setAttribute("lang", lang); }, [dir, lang]);

  const fetchList = async () => {
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/craftsmen?select=*&order=created_at.desc`, { headers: SB_HEADERS });
      const data = await res.json();
      setList(Array.isArray(data) ? data.map(fromDb) : []);
    } catch (e) {
      setList([]);
      setToast(t.toastFailConnect);
    }
  };

  useEffect(() => { fetchList(); }, []);

  useEffect(() => {
    if (selected) {
      fetchComments(selected.id);
    }
  }, [selected]);

  const fetchComments = async (craftsmanId) => {
    setLoadingComments(true);
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/craftsman_comments?craftsman_id=eq.${craftsmanId}&order=created_at.desc`, { headers: SB_HEADERS });
      const data = await res.json();
      setComments(Array.isArray(data) ? data : []);
    } catch (e) {
      setComments([]);
    }
    setLoadingComments(false);
  };

  const submitComment = async (e) => {
    e.preventDefault();
    if (!newComment.name.trim() || !newComment.text.trim() || !newComment.rating) {
      setToast(t.commentError);
      setTimeout(() => setToast(null), 2500);
      return;
    }

    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/craftsman_comments`, {
        method: "POST",
        headers: { ...SB_HEADERS, Prefer: "return=representation" },
        body: JSON.stringify({
          craftsman_id: selected.id,
          author_name: newComment.name.trim(),
          comment: newComment.text.trim(),
          rating: Number(newComment.rating)
        })
      });

      if (!res.ok) throw new Error("Failed to add comment");

      const updatedReviewsCount = (selected.reviews || 0) + 1;
      const updatedRating = (((selected.rating || 0) * (selected.reviews || 0)) + Number(newComment.rating)) / updatedReviewsCount;

      await fetch(`${SUPABASE_URL}/rest/v1/craftsmen?id=eq.${selected.id}`, {
        method: "PATCH",
        headers: SB_HEADERS,
        body: JSON.stringify({ rating: updatedRating, reviews: updatedReviewsCount })
      });

      const updatedCraftsman = { ...selected, rating: updatedRating, reviews: updatedReviewsCount };
      setSelected(updatedCraftsman);
      setNewComment({ name: "", text: "", rating: 5 });
      fetchComments(selected.id);
      fetchList();

      setToast(t.commentSuccess);
      setTimeout(() => setToast(null), 2500);
    } catch (err) {
      setToast(t.toastFailSubmit);
      setTimeout(() => setToast(null), 2500);
    }
  };

  const registerCraftsman = async (data) => {
    setSaving(true);
    let uploadedUrls = [];
    
    try {
      if (data.files && data.files.length > 0) {
        setUploadingText(t.uploadingImages);
        for (const file of data.files) {
          const ext = file.name.split('.').pop();
          const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${ext}`;
          
          const uploadRes = await fetch(`${SUPABASE_URL}/storage/v1/object/craftsmen-gallery/${fileName}`, {
            method: 'POST',
            headers: {
              apikey: SUPABASE_KEY,
              Authorization: `Bearer ${SUPABASE_KEY}`,
              'Content-Type': file.type
            },
            body: file
          });
          
          if (uploadRes.ok) {
            uploadedUrls.push(`${SUPABASE_URL}/storage/v1/object/public/craftsmen-gallery/${fileName}`);
          }
        }
        setUploadingText("");
      }

      // إضافة الحرفي بقيمته المعلقة is_approved أو status pending
      const res = await fetch(`${SUPABASE_URL}/rest/v1/craftsmen`, {
        method: "POST",
        headers: { ...SB_HEADERS, Prefer: "return=representation" },
        body: JSON.stringify(toDb({ ...data, galleryUrls: uploadedUrls, status: "pending", rating: 0, reviews: 0 })),
      });
      if (!res.ok) throw new Error("insert failed");

      try {
        const selectedCat = CATEGORIES.find(c => c.id === data.cat);
        const craftTitle = data.cat === "other" ? data.otherCat : (selectedCat ? selectedCat.name.ar : data.cat);
        const imagesNote = uploadedUrls.length > 0 ? `\n📸 **مرفق:** ${uploadedUrls.length} صور للأعمال` : "";
        const telegramMessage = `🛠 **تسجيل حرفي جديد على المنصة!**\n\n` +
                            `👤 **الاسم الكامل:** ${data.name}\n` +
                            `📞 **رقم الهاتف:** ${data.phone}\n` +
                            `🧰 **الحرفة:** ${craftTitle}\n` +
                            `📍 **المنطقة/الحي:** ${data.hood}\n` +
                            `⭐ **خبرة:** ${data.exp} سنوات\n` +
                            `📝 **الوصف:** ${data.bio}` + imagesNote;

        fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: telegramMessage, parse_mode: "Markdown" })
        });
      } catch (tgError) { console.error("Telegram notification failed:", tgError); }

      await fetchList();
      setView("home");
      setToast(t.toastSubmitted);
      setTimeout(() => setToast(null), 3500);
    } catch (e) {
      setToast(t.toastFailSubmit);
      setUploadingText("");
    }
    setSaving(false);
  };

  const approveCraftsman = async (id) => {
    try {
      await fetch(`${SUPABASE_URL}/rest/v1/craftsmen?id=eq.${id}`, {
        method: "PATCH", headers: SB_HEADERS, body: JSON.stringify({ status: "approved" }),
      });
      await fetchList();
    } catch (e) { setToast(t.toastFailConnect); }
  };

  const rejectCraftsman = async (id) => {
    try {
      await fetch(`${SUPABASE_URL}/rest/v1/craftsmen?id=eq.${id}`, { method: "DELETE", headers: SB_HEADERS });
      await fetchList();
    } catch (e) { setToast(t.toastFailConnect); }
  };

  const shareCraftsman = (c) => {
    const url = `${window.location.href.split("?")[0]}?craftsman=${c.id}`;
    if (navigator.share) {
      navigator.share({ title: c.name, text: craftName(c, lang), url });
    } else {
      navigator.clipboard.writeText(url);
      setToast(t.shareCopied);
      setTimeout(() => setToast(null), 2000);
    }
  };

  const approved = useMemo(() => (list || []).filter((c) => c.status === "approved"), [list]);
  const pending = useMemo(() => (list || []).filter((c) => c.status === "pending"), [list]);

  const filtered = useMemo(() => {
    return approved.filter((c) => {
      const matchCat = activeCat ? c.cat === activeCat : true;
      const matchHood = activeHood === t.all ? true : c.hood === activeHood;
      const matchQuery = query ? c.name.includes(query) || craftName(c, lang).includes(query) || c.bio.includes(query) : true;
      return matchCat && matchHood && matchQuery;
    }).sort((a, b) => (b.rating || 0) - (a.rating || 0));
  }, [approved, query, activeCat, activeHood, lang]);

  return (
    <div style={{ minHeight: "100vh" }} dir={dir}>
      <header className="sticky top-0 z-20 px-4 pt-5 pb-4" style={{ background: "#123B3B" }}>
        <div className="flex items-center justify-between mb-4">
          <div>
            <h1 className="text-white font-black text-xl leading-tight">{t.title}</h1>
            <p className="text-[11px]" style={{ color: "#8FBFBF" }}>{t.subtitle}</p>
          </div>
          <div className="flex items-center gap-2">
            <button onClick={() => setLang(lang === "ar" ? "en" : "ar")}
              className="px-2.5 h-9 rounded-full flex items-center justify-center gap-1 text-white text-xs font-bold" style={{ background: "#1B4B4B" }}>
              🌐 {lang === "ar" ? "EN" : "AR"}
            </button>
            <div onClick={() => setView("admin")} className="w-11 h-11 rounded-full flex items-center justify-center text-white text-lg" style={{ background: "#D9A441", cursor: "pointer" }}>⚙️</div>
          </div>
        </div>
        {(view === "home" || view === "list") && (
          <div className="flex items-center gap-2 rounded-2xl px-3 py-2.5" style={{ background: "#1B4B4B" }}>
            <span style={{ opacity: 0.6 }}>🔍</span>
            <input
              value={query}
              onChange={(e) => { setQuery(e.target.value); setView("list"); }}
              placeholder={t.searchPlaceholder}
              className="bg-transparent outline-none text-sm text-white placeholder-[#8FBFBF] flex-1"
            />
          </div>
        )}
      </header>

      {list === null ? (
        <div className="flex flex-col items-center justify-center py-24 text-stone-400 gap-2">
          <div className="spinner"></div>
          <span className="text-xs font-bold">{t.loading}</span>
        </div>
      ) : (
        <>
          {view === "home" && (
            <main className="px-4 pb-24">
              <div className="flex gap-2 overflow-x-auto py-4 hide-scrollbar">
                {[t.all, ...NEIGHBORHOODS.map((h) => h[lang])].map((h, idx) => {
                  const hoodValue = idx === 0 ? t.all : NEIGHBORHOODS[idx - 1].ar;
                  return (
                    <button key={h} onClick={() => setActiveHood(hoodValue)} className="whitespace-nowrap text-xs font-bold px-3.5 py-2 rounded-full border transition"
                      style={activeHood === hoodValue ? { background: "#123B3B", color: "white", borderColor: "#123B3B" } : { background: "white", color: "#123B3B", borderColor: "#DCD5C4" }}>
                      {h}
                    </button>
                  );
                })}
              </div>

              <h2 className="font-black text-[#123B3B] text-sm mb-3 mt-2">{t.chooseCategory}</h2>
              <div className="grid grid-cols-4 gap-3 mb-6">
                {CATEGORIES.map((c) => {
                  const count = approved.filter((x) => x.cat === c.id).length;
                  return (
                    <button key={c.id} onClick={() => { setActiveCat(c.id); setView("list"); }} className="flex flex-col items-center gap-1.5">
                      <div className="w-14 h-14 rounded-2xl flex items-center justify-center shadow-sm relative" style={{ background: c.color + "1A", border: `1.5px solid ${c.color}33` }}>
                        <span style={{ fontSize: 22 }}>{c.icon}</span>
                        {count > 0 && <span className="absolute -top-1.5 -left-1.5 text-[9px] font-black text-white rounded-full w-4 h-4 flex items-center justify-center" style={{ background: c.color }}>{count}</span>}
                      </div>
                      <span className="text-[11px] font-bold text-[#3A3A3A]">{c.name[lang]}</span>
                    </button>
                  );
                })}
              </div>

              <button onClick={() => setView("register")} className="w-full flex items-center justify-center gap-2 py-3.5 rounded-2xl font-black text-white text-sm mb-6" style={{ background: "#D9A441" }}>
                <span>+</span> {t.registerCta}
              </button>

              <div className="flex items-center justify-between mb-3">
                <h2 className="font-black text-[#123B3B] text-sm">{t.topRated}</h2>
                <button onClick={() => setView("list")} className="text-[11px] font-bold" style={{ color: "#D9A441" }}>{t.viewAll}</button>
              </div>
              <div className="space-y-3">
                {approved.length === 0 ? (
                  <p className="text-center text-xs text-stone-400 py-6">{t.noCraftsmenYet}</p>
                ) : (
                  [...approved].sort((a, b) => (b.rating || 0) - (a.rating || 0)).slice(0, 3).map((c) => (
                    <CraftCard key={c.id} c={c} cat={catInfo(c.cat)} lang={lang} t={t} onClick={() => setSelected(c)} />
                  ))
                )}
              </div>
            </main>
          )}

          {view === "list" && (
            <main className="px-4 pb-24 pt-4">
              <div className="flex items-center gap-2 mb-4">
                <button onClick={() => { setView("home"); setActiveCat(null); setQuery(""); }} className="text-[#123B3B]">{dir === "rtl" ? "←" : "→"}</button>
                <h2 className="font-black text-[#123B3B] text-base flex-1">
                  {activeCat ? catInfo(activeCat).name[lang] : t.navSearch}
                  <span className="text-xs font-normal text-stone-500"> ({filtered.length})</span>
                </h2>
              </div>

              <div className="flex gap-2 overflow-x-auto pb-3 hide-scrollbar">
                <button onClick={() => setActiveCat(null)} className="whitespace-nowrap text-[11px] font-bold px-3 py-1.5 rounded-full border"
                  style={!activeCat ? { background: "#123B3B", color: "white", borderColor: "#123B3B" } : { background: "white", color: "#123B3B", borderColor: "#DCD5C4" }}>
                  {t.allCrafts}
                </button>
                {CATEGORIES.map((c) => (
                  <button key={c.id} onClick={() => setActiveCat(c.id)} className="whitespace-nowrap text-[11px] font-bold px-3 py-1.5 rounded-full border"
                    style={activeCat === c.id ? { background: c.color, color: "white", borderColor: c.color } : { background: "white", color: "#123B3B", borderColor: "#DCD5C4" }}>
                    {c.name[lang]}
                  </button>
                ))}
              </div>

              {filtered.length === 0 ? (
                <div className="text-center py-16 text-stone-400">
                  <div style={{ fontSize: 32 }} className="mb-3">🗂️</div>
                  <p className="text-sm font-bold">{t.noResults}</p>
                  <p className="text-xs mt-1">{t.tryOther}</p>
                </div>
              ) : (
                <div className="space-y-3">
                  {filtered.map((c) => <CraftCard key={c.id} c={c} cat={catInfo(c.cat)} lang={lang} t={t} onClick={() => setSelected(c)} />)}
                </div>
              )}
            </main>
          )}

          {view === "register" && (
            <RegisterForm onBack={() => setView("home")} onSubmit={registerCraftsman} saving={saving} uploadingText={uploadingText} t={t} lang={lang} />
          )}

          {view === "admin" && (
            <main className="px-4 pb-24 pt-4">
              <h2 className="font-black text-[#123B3B] text-base mb-4">{t.adminTitle}</h2>
              {!adminUnlocked ? (
                <div className="bg-white rounded-2xl p-5 border" style={{ borderColor: "#E6E0D2" }}>
                  <p className="text-xs text-stone-500 font-bold mb-3">{t.adminPinPrompt}</p>
                  <input value={pinInput} onChange={(e) => { setPinInput(e.target.value); setPinError(false); }} type="password"
                    className="w-full border rounded-xl px-3 py-2.5 text-sm mb-2 outline-none"
                    style={{ borderColor: pinError ? "#C0392B" : "#DCD5C4" }} placeholder={t.adminPinPlaceholder} />
                  {pinError && <p className="text-[11px] text-red-600 font-bold mb-2">{t.adminPinWrong}</p>}
                  <button onClick={() => pinInput === ADMIN_PIN ? setAdminUnlocked(true) : setPinError(true)}
                    className="w-full py-2.5 rounded-xl font-bold text-white text-sm" style={{ background: "#123B3B" }}>{t.adminLogin}</button>
                </div>
              ) : pending.length === 0 ? (
                <p className="text-center text-xs text-stone-400 py-10">{t.adminNoPending}</p>
              ) : (
                <div className="space-y-3">
                  {pending.map((c) => (
                    <div key={c.id} className="bg-white rounded-2xl p-4 border" style={{ borderColor: "#E6E0D2" }}>
                      <div className="flex items-center justify-between mb-2">
                        <span className="font-black text-[#123B3B] text-sm">{c.name}</span>
                        <span className="text-[10px] font-bold px-2 py-0.5 rounded-full" style={{ background: "#D9A44122", color: "#B8842E" }}>🕐 {t.pendingLabel}</span>
                      </div>
                      <p className="text-[11px] text-stone-500 mb-1">{craftName(c, lang)} · {hoodName(c.hood, lang)} · {c.exp} {t.yearsExp}</p>
                      <p className="text-xs text-stone-600 mb-1">{c.bio}</p>
                      <p className="text-[11px] font-mono text-stone-500 mb-3" dir="ltr">{c.phone}</p>
                      
                      {c.galleryUrls && c.galleryUrls.length > 0 && (
                        <div className="flex gap-2 overflow-x-auto pb-2 mb-3 hide-scrollbar">
                          {c.galleryUrls.map((url, i) => (
                            <a key={i} href={url} target="_blank" rel="noreferrer">
                              <img src={url} className="w-12 h-12 rounded object-cover border border-stone-200 shrink-0" alt="عمل" />
                            </a>
                          ))}
                        </div>
                      )}

                      <div className="grid grid-cols-2 gap-2">
                        <button onClick={() => approveCraftsman(c.id)} className="py-2 rounded-xl font-bold text-white text-xs" style={{ background: "#3DAA5C" }}>✅ {t.approveBtn}</button>
                        <button onClick={() => rejectCraftsman(c.id)} className="py-2 rounded-xl font-bold text-xs border" style={{ borderColor: "#DCD5C4", color: "#8A8375" }}>{t.rejectBtn}</button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </main>
          )}
        </>
      )}

      <nav className="fixed bottom-0 inset-x-0 bg-white border-t flex justify-around py-2.5" style={{ borderColor: "#E6E0D2" }}>
        <button onClick={() => setView("home")} className="flex flex-col items-center gap-0.5">
          <span style={{ fontSize: 18, opacity: view === "home" ? 1 : 0.4 }}>🏠</span>
          <span className="text-[10px] font-bold" style={{ color: view === "home" ? "#123B3B" : "#B0A996" }}>{t.navHome}</span>
        </button>
        <button onClick={() => setView("list")} className="flex flex-col items-center gap-0.5">
          <span style={{ fontSize: 18, opacity: view === "list" ? 1 : 0.4 }}>🔍</span>
          <span className="text-[10px] font-bold" style={{ color: view === "list" ? "#123B3B" : "#B0A996" }}>{t.navSearch}</span>
        </button>
        <button onClick={() => setView("register")} className="flex flex-col items-center gap-0.5">
          <span style={{ fontSize: 18, opacity: view === "register" ? 1 : 0.4 }}>➕</span>
          <span className="text-[10px] font-bold" style={{ color: view === "register" ? "#123B3B" : "#B0A996" }}>{t.navRegister}</span>
        </button>
      </nav>

      {toast && (
        <div className="fixed bottom-20 inset-x-4 z-40 bg-[#123B3B] text-white text-xs font-bold rounded-xl px-4 py-3 text-center shadow-lg">{toast}</div>
      )}

      {selected && (
        <div className="fixed inset-0 z-30 flex items-end justify-center" style={{ background: "rgba(18,30,30,0.5)" }} onClick={() => setSelected(null)}>
          <div onClick={(e) => e.stopPropagation()} className="bg-white rounded-t-3xl w-full max-w-md p-5 relative max-h-[90vh] overflow-y-auto hide-scrollbar">
            <button onClick={() => setSelected(null)} className="absolute left-4 top-4 text-stone-400 text-lg">✕</button>
            <div className="flex items-start gap-3 mb-4">
              <div className="w-16 h-16 rounded-2xl flex items-center justify-center shrink-0" style={{ background: catInfo(selected.cat).color + "1A" }}>
                <span style={{ fontSize: 28 }}>{catInfo(selected.cat).icon}</span>
              </div>
              <div className="flex-1">
                <h3 className="font-black text-[#123B3B] text-base">{selected.name}</h3>
                <p className="text-xs text-stone-500 font-bold">{craftName(selected, lang)} · {selected.exp} {t.yearsExp}</p>
                <div className="flex items-center gap-1.5 mt-1">
                  <Stars value={selected.rating} />
                  <span className="text-xs font-bold text-stone-600">{selected.rating ? selected.rating.toFixed(1) : t.newLabel} {selected.reviews ? `(${selected.reviews} ${t.reviewsLabel})` : ""}</span>
                </div>
              </div>
              <button onClick={() => shareCraftsman(selected)} className="text-lg" title={t.shareBtn}>🔗</button>
            </div>
            <div className="flex items-center gap-1.5 text-xs text-stone-500 mb-3"><span>📍</span><span>{hoodName(selected.hood, lang)}</span></div>
            <p className="text-sm text-stone-700 leading-relaxed mb-4" style={{ background: "#F5F2EA", padding: "10px 12px", borderRadius: 12 }}>{selected.bio}</p>

            {selected.galleryUrls && selected.galleryUrls.length > 0 && (
              <div className="mb-5">
                <h4 className="text-xs font-bold text-stone-500 mb-2">{t.galleryTitle}</h4>
                <div className="flex gap-2 overflow-x-auto pb-2 hide-scrollbar">
                  {selected.galleryUrls.map((url, i) => (
                    <a key={i} href={url} target="_blank" rel="noreferrer" className="shrink-0">
                      <img src={url} alt={`عمل ${i + 1}`} className="w-24 h-24 object-cover rounded-xl border border-stone-200" />
                    </a>
                  ))}
                </div>
              </div>
            )}

            {/* أزرار الاتصال السريع */}
            <div className="grid grid-cols-2 gap-3 mb-6">
              <a href={`tel:${selected.phone}`} className="flex items-center justify-center gap-2 py-3 rounded-2xl font-black text-white text-xs shadow-sm" style={{ background: "#2C6E6E" }}>
                <span>📞</span> {t.call}
              </a>
              <a href={`https://wa.me/27${selected.phone.replace(/^0/, '')}`} target="_blank" rel="noreferrer" className="flex items-center justify-center gap-2 py-3 rounded-2xl font-black text-white text-xs shadow-sm" style={{ background: "#25D366" }}>
                <span>💬</span> {t.whatsapp}
              </a>
            </div>

            {/* قسم التعليقات والتقييمات */}
            <div className="border-t pt-4 mt-4" style={{ borderColor: "#E6E0D2" }}>
              <h4 className="text-xs font-black text-[#123B3B] mb-3">{t.commentsTitle}</h4>

              {loadingComments ? (
                <div className="flex justify-center py-4"><div className="spinner" style={{ width: 20, height: 20 }}></div></div>
              ) : comments.length === 0 ? (
                <p className="text-xs text-stone-400 mb-4">{t.noComments}</p>
              ) : (
                <div className="space-y-2.5 mb-5 max-h-48 overflow-y-auto hide-scrollbar">
                  {comments.map((cm) => (
                    <div key={cm.id} className="p-3 rounded-xl border" style={{ background: "#F9F8F6", borderColor: "#E6E0D2" }}>
                      <div className="flex items-center justify-between mb-1">
                        <span className="font-bold text-xs text-[#123B3B]">{cm.author_name}</span>
                        <Stars value={cm.rating} />
                      </div>
                      <p className="text-xs text-stone-600">{cm.comment}</p>
                    </div>
                  ))}
                </div>
              )}

              {/* إضافة تعليق وتقييم */}
              <form onSubmit={submitComment} className="bg-[#F5F2EA] p-3.5 rounded-2xl border" style={{ borderColor: "#E6E0D2" }}>
                <h5 className="font-bold text-xs text-[#123B3B] mb-2">{t.addCommentTitle}</h5>
                <div className="flex items-center gap-2 mb-2">
                  <span className="text-xs text-stone-600">التقييم:</span>
                  <select value={newComment.rating} onChange={(e) => setNewComment({...newComment, rating: Number(e.target.value)})} className="border rounded-lg px-2 py-1 text-xs outline-none bg-white" style={{ borderColor: "#DCD5C4" }}>
                    <option value="5">⭐⭐⭐⭐⭐ (5)</option>
                    <option value="4">⭐⭐⭐⭐ (4)</option>
                    <option value="3">⭐⭐⭐ (3)</option>
                    <option value="2">⭐⭐ (2)</option>
                    <option value="1">⭐ (1)</option>
                  </select>
                </div>
                <input type="text" placeholder={t.commenterName} value={newComment.name} onChange={(e) => setNewComment({...newComment, name: e.target.value})} className="w-full border rounded-xl px-3 py-2 text-xs mb-2 outline-none bg-white" style={{ borderColor: "#DCD5C4" }} />
                <textarea placeholder={t.commentText} value={newComment.text} onChange={(e) => setNewComment({...newComment, text: e.target.value})} rows="2" className="w-full border rounded-xl px-3 py-2 text-xs mb-2 outline-none bg-white" style={{ borderColor: "#DCD5C4" }}></textarea>
                <button type="submit" className="w-full py-2 rounded-xl font-bold text-white text-xs" style={{ background: "#123B3B" }}>{t.sendComment}</button>
              </form>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
