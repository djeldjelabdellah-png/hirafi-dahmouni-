const catInfo = (id) => CATEGORIES.find((c) => c.id === id) || CATEGORIES[0];
const craftName = (c, lang) => (c.cat === "other" && c.otherCat ? c.otherCat : catInfo(c.cat).name[lang]);
const hoodName = (hoodAr, lang) => {
  const h = NEIGHBORHOODS.find((n) => n.ar === hoodAr);
  return h ? h[lang] : hoodAr;
};

const toDb = (c) => ({
  name: c.name, email: c.email || null, cat: c.cat, other_cat: c.otherCat || null, hood: c.hood,
  exp: c.exp, phone: c.phone, bio: c.bio, status: "pending", // فرض حالة "قيد المراجعة" إجبارياً
  rating: c.rating || 0, reviews: c.reviews || 0, gallery_urls: c.galleryUrls || [],
  review_list: c.reviewList || []
});
const fromDb = (r) => ({
  id: r.id, name: r.name, email: r.email, cat: r.cat, otherCat: r.other_cat, hood: r.hood,
  exp: r.exp, phone: r.phone, bio: r.bio, status: r.status || "pending", rating: r.rating, 
  reviews: r.reviews, galleryUrls: r.gallery_urls || [], reviewList: r.review_list || []
});

function Stars({ value }) {
  return (
    <span style={{ letterSpacing: "1px" }}>
      {[1, 2, 3, 4, 5].map((i) => (
        <span key={i} style={{ color: i <= Math.round(value || 0) ? "#D9A441" : "#D6D0C2", fontSize: 13 }}>★</span>
      ))}
    </span>
  );
}

function App() {
  const [lang, setLang] = useState("ar");
  const t = STRINGS[lang];
  const dir = lang === "ar" ? "rtl" : "ltr";

  const [list, setList] = useState(null);
  const [query, setQuery] = useState("");
  const [activeCat, setActiveCat] = useState(null);
  const [activeHood, setActiveHood] = useState(t.all);
  const [selected, setSelected] = useState(null);
  const [view, setView] = useState("home");
  const [toast, setToast] = useState(null);
  const [saving, setSaving] = useState(false);
  const [uploadingText, setUploadingText] = useState("");
 const [editingCraftsman, setEditingCraftsman] = useState(null);
  const [completingCraftsman, setCompletingCraftsman] = useState(null);

  const [newRatingVal, setNewRatingVal] = useState(5);
  const [newReviewerName, setNewReviewerName] = useState("");
  const [newCommentText, setNewCommentText] = useState("");
  const [isSubmittingReview, setIsSubmittingReview] = useState(false);

  const changeView = (newView) => {
    if (newView !== view) {
      window.history.pushState({ view: newView }, "");
      setView(newView);
      window.scrollTo(0, 0);
    }
  };

  useEffect(() => {
    if (!window.history.state) {
      window.history.replaceState({ view: "home" }, "");
    }
    const handlePopState = (event) => {
      if (event.state && event.state.view) {
        setView(event.state.view);
      } else {
        setView("home");
      }
    };
    window.addEventListener("popstate", handlePopState);
    return () => window.removeEventListener("popstate", handlePopState);
  }, []);

  useEffect(() => { setActiveHood(t.all); }, [lang]);
  useEffect(() => { document.documentElement.setAttribute("dir", dir); document.documentElement.setAttribute("lang", lang); }, [dir, lang]);

  const fetchList = async () => {
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/craftsmen?select=*&order=created_at.desc`, { headers: SB_HEADERS });
      const data = await res.json();
     setList(Array.isArray(data) ? data.map(fromDb) : []);
    } catch (e) {
      setList([]);
      setToast(t.toastFailConnect);
      setTimeout(() => setToast(null), 2000);
    }
  };

  useEffect(() => { fetchList(); }, []);

  const registerCraftsman = async (data) => {
    setSaving(true);
    let uploadedUrls = [];
    try {
      if (data.files && data.files.length > 0) {
        setUploadingText(t.uploadingImages);
        for (const file of data.files) {
          const ext = file.name.split('.').pop();
          const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${ext}`;
          const uploadRes = await fetch(`${SUPABASE_URL}/storage/v1/object/craftsmen-gallery/${fileName}`, {
            method: 'POST',
            headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, 'Content-Type': file.type },
            body: file
          });
          if (uploadRes.ok) {
            uploadedUrls.push(`${SUPABASE_URL}/storage/v1/object/public/craftsmen-gallery/${fileName}`);
          }
        }
        setUploadingText("");
      }
      // التحقق من عدم وجود بريد مسجل أو طلب قيد المراجعة (طبقة حماية احتياطية إضافية)
      const checkRes = await fetch(
        `${SUPABASE_URL}/rest/v1/craftsmen?email=eq.${encodeURIComponent(data.email)}&select=id,status`,
        { headers: SB_HEADERS }
      );

      const existing = await checkRes.json();

      const blocked = existing.find(
        c => c.status === "pending" || c.status === "approved"
      );

      if (blocked) {
        setToast("هذا البريد الإلكتروني مسجل مسبقاً أو لديه طلب قيد المراجعة");
        setSaving(false);
        return;
      }

      // إنشاء الحرفي الجديد
      const res = await fetch(`${SUPABASE_URL}/rest/v1/craftsmen`, {
        method: "POST",
        headers: { ...SB_HEADERS, Prefer: "return=representation" },
        body: JSON.stringify(
          toDb({
            ...data,
            galleryUrls: uploadedUrls,
            rating: 0,
            reviews: 0,
            reviewList: []
          })
        ),
      });

      if (!res.ok) throw new Error("insert failed");

      const insertedData = await res.json();
      const newCraftsman = insertedData[0];

      await fetchList();

      try {
        const selectedCat = CATEGORIES.find(c => c.id === data.cat);
        const craftTitle = data.cat === "other" ? data.otherCat : (selectedCat ? selectedCat.name.ar : data.cat);
        const imagesNote = uploadedUrls.length > 0 ? `\n📸 **مرفق:** ${uploadedUrls.length} صور للأعمال` : "";
        const telegramMessage = `🛠 **تسجيل حرفي جديد بانتظار الموافقة!**\n\n` +
                                `👤 **الاسم الكامل:** ${data.name}\n` +
                                `📞 **رقم الهاتف:** ${data.phone}\n` +
                                `🧰 **الحرفة:** ${craftTitle}\n` +
                                `📍 **المنطقة/الحي:** ${data.hood}\n` +
                                `⭐ **خبرة:** ${data.exp} سنوات\n` +
                                `📝 **الوصف:** ${data.bio}` + imagesNote;

        fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            chat_id: TELEGRAM_CHAT_ID,
            text: telegramMessage,
            parse_mode: "Markdown",
            reply_markup: {
              inline_keyboard: [[
                {
                  text: "✅ قبول",
                  callback_data: `approve_${newCraftsman.id}`
                },
                {
                  text: "❌ رفض",
                  callback_data: `reject_${newCraftsman.id}`
                }
              ]]
            }
          })
        })
      } catch (tgError) { console.error("Telegram notification failed:", tgError); }

      changeView("home");
      setToast(t.toastSubmitted);
      setTimeout(() => setToast(null), 3500);
    } catch (e) {
      setToast("خطأ تقني: " + (e.message || "فشل الاتصال"));
      setUploadingText("");
    }
    setSaving(false);
  };

  const updateCraftsman = async (data) => {
    setSaving(true);
    let uploadedUrls = editingCraftsman.galleryUrls || [];
    try {
      if (data.files && data.files.length > 0) {
        setUploadingText(t.uploadingImages);
        for (const file of data.files) {
          const ext = file.name.split('.').pop();
          const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${ext}`;
          const uploadRes = await fetch(`${SUPABASE_URL}/storage/v1/object/craftsmen-gallery/${fileName}`, {
            method: 'POST',
            headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, 'Content-Type': file.type },
            body: file
          });
          if (uploadRes.ok) {
            uploadedUrls.push(`${SUPABASE_URL}/storage/v1/object/public/craftsmen-gallery/${fileName}`);
          }
        }
        setUploadingText("");
      }

      const res = await fetch(`${SUPABASE_URL}/rest/v1/craftsmen?id=eq.${editingCraftsman.id}`, {
        method: "PATCH",
        headers: { ...SB_HEADERS },
        body: JSON.stringify({
          name: data.name, cat: data.cat, other_cat: data.otherCat || null,
          hood: data.hood, exp: Number(data.exp) || 0, phone: data.phone,
          bio: data.bio, gallery_urls: uploadedUrls
        }),
      });
      if (!res.ok) throw new Error("update failed");

      await fetchList();
      changeView("home");
      setToast(t.toastUpdated);
      setTimeout(() => setToast(null), 3500);
    } catch (e) {
      setToast("خطأ تقني: " + (e.message || "فشل التحديث"));
      setUploadingText("");
    }
    setSaving(false);
  };

  const deleteCraftsmanAccount = async (id) => {
    if (!window.confirm(t.deleteConfirmMsg)) return;
    setSaving(true);
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/craftsmen?id=eq.${id}`, {
        method: "DELETE",
        headers: SB_HEADERS,
      });
      if (!res.ok) throw new Error("delete failed");

      await fetchList();
      changeView("home");
      setToast(t.toastDeleted);
      setTimeout(() => setToast(null), 3500);
    } catch (e) {
      setToast(t.toastFailSubmit);
    }
    setSaving(false);
  };

  const completeRegistrationEmail = async (craftsmanId, newEmail) => {
    setSaving(true);
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/craftsmen?id=eq.${craftsmanId}`, {
        method: "PATCH",
        headers: SB_HEADERS,
        body: JSON.stringify({ email: newEmail }),
      });
      if (!res.ok) throw new Error("Failed");
      await fetchList();
      changeView("home");
      setToast(t.toastUpdated);
      setTimeout(() => setToast(null), 3500);
    } catch (e) {
      setToast(t.toastFailSubmit);
    }
    setSaving(false);
  };

  const approveCraftsman = async (id) => {
    try {
      await fetch(`${SUPABASE_URL}/rest/v1/craftsmen?id=eq.${id}`, {
        method: "PATCH", headers: SB_HEADERS, body: JSON.stringify({ status: "approved" }),
      });
      await fetchList();
    } catch (e) { setToast(t.toastFailConnect); }
  };

  const rejectCraftsman = async (id) => {
    try {
      await fetch(`${SUPABASE_URL}/rest/v1/craftsmen?id=eq.${id}`, { method: "DELETE", headers: SB_HEADERS });
      await fetchList();
    } catch (e) { setToast(t.toastFailConnect); }
  };

  const submitReviewAndComment = async (e) => {
    e.preventDefault();
    if (!newReviewerName.trim() || !newCommentText.trim()) return;

    setIsSubmittingReview(true);
    const currentReviews = selected.reviews || 0;
    const currentRating = selected.rating || 0;
    const newTotalReviews = currentReviews + 1;
    const newAvgRating = ((currentRating * currentReviews) + newRatingVal) / newTotalReviews;

    const newReviewItem = {
      name: newReviewerName.trim(),
      rating: newRatingVal,
      comment: newCommentText.trim(),
      date: new Date().toISOString().split('T')[0]
    };

    const updatedReviewList = [newReviewItem, ...(selected.reviewList || [])];

    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/craftsmen?id=eq.${selected.id}`, {
        method: "PATCH",
        headers: SB_HEADERS,
        body: JSON.stringify({
          rating: newAvgRating,
          reviews: newTotalReviews,
          review_list: updatedReviewList
        }),
      });

      if (!res.ok) throw new Error("Failed to submit review");

      const updatedSelected = {
        ...selected,
        rating: newAvgRating,
        reviews: newTotalReviews,
        reviewList: updatedReviewList
      };
      setSelected(updatedSelected);
      setNewCommentText("");
      setNewReviewerName("");
      setIsSubmittingReview(false);
      await fetchList();
      setToast(t.thanksRating);
      setTimeout(() => setToast(null), 2500);

  // فلترة صارمة: فقط الحسابات التي حالتها 'approved' تظهر للعامة

function CompleteRegistrationView({ craftsman, onBack, onComplete, saving, t, lang }) {
  const [emailInput, setEmailInput] = useState("");
  const [step, setStep] = useState(1);
  const [generatedOtp, setGeneratedOtp] = useState("");
  const [verificationCode, setVerificationCode] = useState("");
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);

  const handleSendOtp = async (e) => {
    e.preventDefault();
    if (!emailInput.trim() || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailInput.trim())) {
      setError(t.emailError);
      return;
    }
    setError("");
    const otp = Math.floor(1000 + Math.random() * 9000).toString();
    setGeneratedOtp(otp);

    setLoading(true);
    try {
      await emailjs.send('service_in25o7y', 'template_o73g9ys', {
          to_email: emailInput.trim(),
          otp_code: otp,
          to_name: craftsman.name
      });
      setLoading(false);
      setStep(2);
    } catch (err) {
      setLoading(false);
      setError('فشل إرسال رمز التحقق، يرجى المحاولة لاحقاً.');
    }
  };

  const handleVerifyOtp = (e) => {
    e.preventDefault();
    if (verificationCode.trim() === generatedOtp) {
      onComplete(craftsman.id, emailInput.trim());
    } else {
      setError('رمز التحقق غير صحيح.');

  return (

        <p className="text-xs font-bold text-amber-800">أهلاً بك يا <span className="underline">{craftsman.name}</span>!</p>
        <p className="text-[11px] text-amber-700 mt-1">حسابك مسجل مسبقاً. يرجى إدخال بريدك الإلكتروني لتأكيده والاحتفاظ بجميع بياناتك وملفك الشخصي الحالي دون الحاجة لإعادة التسجيل.</p>
      </div>

      {step === 1 ? (
        <form onSubmit={handleSendOtp} className="space-y-4 bg-white p-5 rounded-2xl border" style={{ borderColor: "#E6E0D2" }}>
          <Field label={t.email}>
            <input type="email" value={emailInput} onChange={(e) => setEmailInput(e.target.value)} className="ipt" placeholder="name@example.com" dir="ltr" />
          </Field>
          {error && <p className="text-xs text-red-600 font-bold">{error}</p>}
          <button type="submit" disabled={loading} className="w-full py-3.5 rounded-2xl font-black text-white text-sm flex items-center justify-center gap-2" style={{ background: "#D9A441" }}>
            {loading ? t.submitting : t.submitBtn}
          </button>
        </form>
      ) : (
        <form onSubmit={handleVerifyOtp} className="space-y-4 bg-white p-5 rounded-2xl border" style={{ borderColor: "#E6E0D2" }}>
          <p className="text-xs text-stone-600 font-bold leading-relaxed">{t.verifySubtitle}</p>
          <Field label={t.verifyTitle}>
            <input value={verificationCode} onChange={(e) => setVerificationCode(e.target.value.replace(/\D/g, ""))} className="ipt text-center text-lg tracking-widest font-mono" placeholder={t.verifyCodePlaceholder} maxLength="4" dir="ltr" inputMode="numeric" />
          </Field>
          {error && <p className="text-xs text-red-600 font-bold">{error}</p>}
          <button type="submit" disabled={saving} className="w-full py-3.5 rounded-2xl font-black text-white text-sm flex items-center justify-center gap-2" style={{ background: "#3DAA5C", opacity: saving ? 0.7 : 1 }}>
            {saving ? t.submitting : t.confirmVerifyBtn}
          </button>
          <button type="button" onClick={() => setStep(1)} className="w-full py-2 text-xs text-stone-500 font-bold text-center">تغيير البريد الإلكتروني</button>
        </form>
      )}
    </main>
  );
}

function EditAuthView({ onBack, allCraftsmen, t, lang, onVerified }) {
  const [emailInput, setEmailInput] = useState("");
  const [step, setStep] = useState(1);
  const [generatedOtp, setGeneratedOtp] = useState("");
  const [verificationCode, setVerificationCode] = useState("");
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);
  const [matchedCraftsman, setMatchedCraftsman] = useState(null);

  const handleSendOtp = async (e) => {
    e.preventDefault();
    if (!emailInput.trim()) {
      setError(t.emailError);
      return;
    }
    const found = allCraftsmen.find(c => c.email && c.email.toLowerCase() === emailInput.trim().toLowerCase());
    if (!found) {
      setError("البريد الإلكتروني غير مسجل في النظام!");
      return;
    }
    setMatchedCraftsman(found);
    setError("");

    const otp = Math.floor(1000 + Math.random() * 9000).toString();
    setGeneratedOtp(otp);

    setLoading(true);
    try {
      await emailjs.send('service_in25o7y', 'template_o73g9ys', {
          to_email: found.email,
          otp_code: otp,
          to_name: found.name
      });
      setLoading(false);
      setStep(2);
    } catch (err) {
      setLoading(false);
      setError('فشل إرسال رمز التحقق، يرجى المحاولة لاحقاً.');
    }
  };

  const handleVerifyOtp = (e) => {
    e.preventDefault();
    if (verificationCode.trim() === generatedOtp) {
      onVerified(matchedCraftsman);
    } else {
      setError('رمز التحقق غير صحيح.');
    }
  };

  return (
    <main className="px-4 pb-24 pt-4">
      <div className="flex items-center gap-2 mb-5">
        <button type="button" onClick={onBack} className="text-[#0E3D37] font-bold text-lg">{lang === "ar" ? "➔" : "⬅"}</button>
        <h2 className="font-black text-[#0E3D37] text-base">{t.editTitle}</h2>
      </div>

      {step === 1 ? (
        <form onSubmit={handleSendOtp} className="space-y-4 bg-white p-5 rounded-2xl border" style={{ borderColor: "#E6E0D2" }}>
          <p className="text-xs text-stone-600 font-bold leading-relaxed">أدخل بريدك الإلكتروني المسجل سابقاً للتحقق من هويتك وتعديل معلوماتك:</p>
          <Field label={t.email}>
            <input type="email" value={emailInput} onChange={(e) => setEmailInput(e.target.value)} className="ipt" placeholder="name@example.com" dir="ltr" />
          </Field>
          {error && <p className="text-xs text-red-600 font-bold">{error}</p>}
          <button type="submit" disabled={loading} className="w-full py-3.5 rounded-2xl font-black text-white text-sm flex items-center justify-center gap-2" style={{ background: "#0E3D37" }}>
            {loading ? t.submitting : t.submitBtn}
          </button>
        </form>
      ) : (
        <form onSubmit={handleVerifyOtp} className="space-y-4 bg-white p-5 rounded-2xl border" style={{ borderColor: "#E6E0D2" }}>
          <p className="text-xs text-stone-600 font-bold leading-relaxed">{t.verifySubtitle}</p>
          <Field label={t.verifyTitle}>
            <input value={verificationCode} onChange={(e) => setVerificationCode(e.target.value.replace(/\D/g, ""))} className="ipt text-center text-lg tracking-widest font-mono" placeholder={t.verifyCodePlaceholder} maxLength="4" dir="ltr" inputMode="numeric" />
          </Field>
          {error && <p className="text-xs text-red-600 font-bold">{error}</p>}
          <button type="submit" className="w-full py-3.5 rounded-2xl font-black text-white text-sm" style={{ background: "#3DAA5C" }}>
            {t.confirmVerifyBtn}
          </button>
          <button type="button" onClick={() => setStep(1)} className="w-full py-2 text-xs text-stone-500 font-bold text-center">تغيير البريد الإلكتروني</button>
        </form>
      )}
    </main>
  );
}

function EditForm({ craftsman, onBack, onSubmit, onDelete, saving, uploadingText, t, lang }) {

    name: craftsman.name || "",
    cat: craftsman.cat || "plumb",
    otherCat: craftsman.otherCat || "",
    hood: craftsman.hood || NEIGHBORHOODS[0].ar,
    exp: craftsman.exp || "",
    phone: craftsman.phone || "",
    bio: craftsman.bio || ""
  });
  const [files, setFiles] = useState([]);
  const [error, setError] = useState("");

  const update = (k, v) => setForm((f) => ({ ...f, [k]: v }));

  const handleSubmit = (e) => {
    e.preventDefault();
    if (!form.name.trim() || !form.phone.trim() || !form.bio.trim()) { setError(t.requiredError); return; }

  return (
    <main className="px-4 pb-24 pt-4">

      <form onSubmit={handleSubmit} className="space-y-4">
        <Field label={t.fullName}><input value={form.name} onChange={(e) => update("name", e.target.value)} className="ipt" /></Field>
        <Field label={t.craft}>
          <select value={form.cat} onChange={(e) => update("cat", e.target.value)} className="ipt">
            {CATEGORIES.map((c) => <option key={c.id} value={c.id}>{c.name[lang]}</option>)}
          </select>
        </Field>
        {form.cat === "other" && (
          <Field label={t.otherCraft}><input value={form.otherCat} onChange={(e) => update("otherCat", e.target.value)} className="ipt" /></Field>
        )}
        <Field label={t.neighborhood}>
          <select value={form.hood} onChange={(e) => update("hood", e.target.value)} className="ipt">
            {NEIGHBORHOODS.map((h) => <option key={h.ar} value={h.ar}>{h[lang]}</option>)}

        <Field label={t.experience}><input value={form.exp} onChange={(e) => update("exp", e.target.value.replace(/\D/g, ""))} className="ipt" inputMode="numeric" /></Field>
        <Field label={t.phone}><input value={form.phone} onChange={(e) => update("phone", e.target.value.replace(/\D/g, ""))} className="ipt" placeholder="0550123456" dir="ltr" inputMode="numeric" /></Field>

        <Field label={t.chooseImages}>

          <small className="text-[10px] text-stone-500 mt-1 block font-bold">{t.galleryNote}</small>

        <Field label={t.bio}><textarea value={form.bio} onChange={(e) => update("bio", e.target.value)} className="ipt" rows="3"></textarea></Field>
        {error && <p className="text-xs text-red-600 font-bold">{error}</p>}
        
        <button type="submit" disabled={saving} className="w-full py-3.5 rounded-2xl font-black text-white text-sm flex items-center justify-center gap-2 transition" style={{ background: "#D9A441", opacity: saving ? 0.7 : 1 }}>
          {saving ? (uploadingText || t.submitting) : t.updateBtn}
        </button>

        <button type="button" onClick={() => onDelete(craftsman.id)} disabled={saving} className="w-full py-3 rounded-2xl font-black text-xs text-red-600 border border-red-200 bg-red-50 mt-2 transition">
          🗑️ {t.deleteAccountBtn}
        </button>
      </form>
    </main>
  );
}

function RegisterForm({ onBack, onSubmit, saving, uploadingText, t, lang }) {
  const [form, setForm] = useState({ name: "", email: "", cat: "plumb", otherCat: "", hood: NEIGHBORHOODS[0].ar, exp: "", phone: "", bio: "" });
  const [files, setFiles] = useState([]);
  const [error, setError] = useState("");
  const [step, setStep] = useState(1);
  const [generatedOtp, setGeneratedOtp] = useState("");
  const [verificationCode, setVerificationCode] = useState("");
  const [isSendingOtp, setIsSendingOtp] = useState(false);

  const update = (k, v) => setForm((f) => ({ ...f, [k]: v }));

  const handleInitialSubmit = async (e) => {
    e.preventDefault();
    if (!form.name.trim() || !form.email.trim() || !form.phone.trim() || !form.bio.trim()) { setError(t.requiredError); return; }
    if (form.cat === "other" && !form.otherCat.trim()) { setError(t.otherCraftError); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email.trim())) { setError(t.emailError); return; }
    if (!/^0[5-7][0-9]{8}$/.test(form.phone.trim())) { setError(t.phoneError); return; }

    setError("");
    setIsSendingOtp(true);

    // التحقق من عدم وجود بريد مسجل أو طلب قيد المراجعة (قبل إرسال رمز التحقق)
    try {
      const checkRes = await fetch(
        `${SUPABASE_URL}/rest/v1/craftsmen?email=eq.${encodeURIComponent(form.email.trim())}&select=id,status`,
        { headers: SB_HEADERS }
      );
      const existing = await checkRes.json();
      const blocked = existing.find(c => c.status === "pending" || c.status === "approved");
      if (blocked) {
        setError("هذا البريد الإلكتروني مسجل مسبقاً أو لديه طلب قيد المراجعة");
        setIsSendingOtp(false);
        return;
      }
    } catch (checkErr) {
      setError(t.toastFailConnect);
      setIsSendingOtp(false);
      return;
    }

    const otp = Math.floor(1000 + Math.random() * 9000).toString();
    setGeneratedOtp(otp);

    try {
      await emailjs.send('service_in25o7y', 'template_o73g9ys', {
          to_email: form.email.trim(),
          otp_code: otp,
          to_name: form.name.trim()
      });
      setIsSendingOtp(false);
      setStep(2);
    } catch (err) {
      setIsSendingOtp(false);
      setError('فشل إرسال رمز التحقق عبر البريد الإلكتروني، يرجى المحاولة لاحقاً.');
    }
  };

  const handleVerifyAndComplete = (e) => {
    e.preventDefault();
    if (!verificationCode.trim()) { setError('الرجاء إدخال رمز التحقق'); return; }
    setError("");

    if (verificationCode.trim() === generatedOtp) {
      onSubmit({ ...form, otherCat: form.otherCat.trim(), email: form.email.trim(), phone: form.phone.trim(), exp: Number(form.exp) || 0, files });
    } else {
      setError('رمز التحقق غير صحيح، يرجى إعادة المحاولة.');
    }
  };

  return (
    <main className="px-4 pb-24 pt-4">
      <div className="flex items-center gap-2 mb-5">
        <button type="button" onClick={onBack} className="text-[#0E3D37] font-bold text-lg">{lang === "ar" ? "➔" : "⬅"}</button>
        <h2 className="font-black text-[#0E3D37] text-base">{step === 1 ? t.registerTitle : t.verifyTitle}</h2>
      </div>

      {step === 1 ? (
        <form onSubmit={handleInitialSubmit} className="space-y-4">
          <Field label={t.fullName}><input value={form.name} onChange={(e) => update("name", e.target.value)} className="ipt" /></Field>
          <Field label={t.email}><input type="email" value={form.email} onChange={(e) => update("email", e.target.value)} className="ipt" placeholder="name@example.com" dir="ltr" /></Field>
          <Field label={t.craft}>
            <select value={form.cat} onChange={(e) => update("cat", e.target.value)} className="ipt">
              {CATEGORIES.map((c) => <option key={c.id} value={c.id}>{c.name[lang]}</option>)}
            </select>
          </Field>
          {form.cat === "other" && (
            <Field label={t.otherCraft}><input value={form.otherCat} onChange={(e) => update("otherCat", e.target.value)} className="ipt" /></Field>
          )}
          <Field label={t.neighborhood}>
            <select value={form.hood} onChange={(e) => update("hood", e.target.value)} className="ipt">
              {NEIGHBORHOODS.map((h) => <option key={h.ar} value={h.ar}>{h[lang]}</option>)}
            </select>
          </Field>
          <Field label={t.experience}><input value={form.exp} onChange={(e) => update("exp", e.target.value.replace(/\D/g, ""))} className="ipt" inputMode="numeric" /></Field>
          <Field label={t.phone}><input value={form.phone} onChange={(e) => update("phone", e.target.value.replace(/\D/g, ""))} className="ipt" placeholder="0550123456" dir="ltr" inputMode="numeric" /></Field>

          <Field label={t.chooseImages}>
            <input type="file" accept="image/*" multiple onChange={(e) => setFiles(Array.from(e.target.files))} className="ipt bg-white" style={{ padding: "8px 12px" }} />
            <small className="text-[10px] text-stone-500 mt-1 block font-bold">{t.galleryNote}</small>
          </Field>

          <Field label={t.bio}><textarea value={form.bio} onChange={(e) => update("bio", e.target.value)} className="ipt" rows="3"></textarea></Field>
          {error && <p className="text-xs text-red-600 font-bold">{error}</p>}
          
          <button type="submit" disabled={isSendingOtp} className="w-full py-3.5 rounded-2xl font-black text-white text-sm flex items-center justify-center gap-2 transition" style={{ background: "#D9A441", opacity: isSendingOtp ? 0.7 : 1 }}>
            {isSendingOtp ? t.submitting : t.submitBtn}
          </button>
          <p className="text-[11px] text-stone-400 text-center leading-relaxed">{t.reviewNote}</p>
        </form>
      ) : (
        <form onSubmit={handleVerifyAndComplete} className="space-y-4 bg-white p-5 rounded-2xl border" style={{ borderColor: "#E6E0D2" }}>
          <p className="text-xs text-stone-600 font-bold leading-relaxed">{t.verifySubtitle}</p>
          <Field label={t.verifyTitle}>
            <input value={verificationCode} onChange={(e) => setVerificationCode(e.target.value.replace(/\D/g, ""))} className="ipt text-center text-lg tracking-widest font-mono" placeholder={t.verifyCodePlaceholder} maxLength="4" dir="ltr" inputMode="numeric" />
          </Field>
          {error && <p className="text-xs text-red-600 font-bold">{error}</p>}
          <button type="submit" disabled={saving} className="w-full py-3.5 rounded-2xl font-black text-white text-sm flex items-center justify-center gap-2 transition" style={{ background: "#3DAA5C", opacity: saving ? 0.7 : 1 }}>
            {saving ? (uploadingText || t.submitting) : t.confirmVerifyBtn}
          </button>
          <button type="button" onClick={() => setStep(1)} className="w-full py-2 text-xs text-stone-500 font-bold text-center">العودة لتعديل البيانات</button>
        </form>
      )}
    </main>
  );
}

function Field({ label, children }) {
  return (<div><label className="text-xs font-bold text-[#0E3D37] mb-1.5 block">{label}</label>{children}</div>);
}

function CraftCard({ c, cat, lang, t, onClick, onPromptEmail }) {
  const isMissingEmail = !c.email;

  return (
    <div className="w-full bg-white rounded-2xl p-3.5 flex items-center gap-3 shadow-sm border relative overflow-hidden" style={{ borderColor: isMissingEmail ? "#D9A441" : "#E6E0D2" }}>
      <div
  onClick={onClick}
  className="w-12 h-12 rounded-xl flex items-center justify-center shrink-0 cursor-pointer"
  style={{ background: cat.color + "1A" }}
>
  <i
    className={cat.icon}
    style={{
      fontSize: 22,
      color: cat.color
    }}
  ></i>
</div>
      <div onClick={onClick} className="flex-1 min-w-0 cursor-pointer">
        <div className="flex items-center gap-2">
          <span className="font-black text-[#0E3D37] text-sm truncate block">{c.name}</span>
          {isMissingEmail && (
            <button
              onClick={(e) => {
                e.stopPropagation();
                onPromptEmail();
              }}
              className="text-[9px] font-bold px-1.5 py-0.5 rounded-full text-white bg-amber-600 animate-pulse shrink-0">
              {t.verifyEmailBadge}
            </button>
          )}
        </div>
        <p className="text-[11px] text-stone-500 truncate">{craftName(c, lang)} · {hoodName(c.hood, lang)}</p>
        <div className="flex items-center gap-1 mt-0.5">
          <Stars value={c.rating} />
          <span className="text-[10px] text-stone-400">{c.reviews ? `(${c.reviews})` : t.newLabel}</span>
          {c.galleryUrls && c.galleryUrls.length > 0 && (
            <span className="text-[10px] text-stone-400 border-r border-stone-300 pr-1 mr-1">📸 {c.galleryUrls.length}</span>
          )}
        </div>
      </div>
      <span onClick={onClick} className="text-stone-300 font-bold text-lg cursor-pointer">{lang === "ar" ? "‹" : "›"}</span>
    </div>
  );
}
