<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>حِرَفِي - دليل الحرفيين والمهنيين لمدينة الدحموني</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#123B3B">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>
   (function(){
      emailjs.init({ publicKey: "1YVvuqYAcvu8EWWaS" });
   })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap');
  body { font-family: 'Tajawal', sans-serif; background: #F5F2EA; margin: 0; }
  .spinner { border: 3px solid #DCD5C4; border-top-color: #123B3B; border-radius: 50%; width: 28px; height: 28px; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;

const SUPABASE_URL = "https://epslzxcwurnueboeujbt.supabase.co";
const SUPABASE_KEY = "sb_publishable_1KmMcVM-XtVlajEStTAL7g_0HropMG5";
const SB_HEADERS = {
  apikey: SUPABASE_KEY,
  Authorization: `Bearer ${SUPABASE_KEY}`,
  "Content-Type": "application/json",
};
const ADMIN_PIN = "p@ssw0rd";

const CATEGORIES = [
  { id: "plumb", name: "سباكة", icon: "🔧", color: "#2C6E6E" },
  { id: "elec", name: "كهرباء", icon: "⚡", color: "#D9A441" },
  { id: "carp", name: "نجارة", icon: "🔨", color: "#8B5E3C" },
  { id: "paint", name: "دهان", icon: "🎨", color: "#5C7A8A" },
  { id: "build", name: "بناء", icon: "🏗️", color: "#7A5C4B" },
  { id: "tailor", name: "خياطة", icon: "✂️", color: "#B5566B" },
  { id: "mech", name: "ميكانيك", icon: "🚗", color: "#3D5A6C" },
  { id: "clean", name: "تنظيف", icon: "✨", color: "#4A8B6F" },
  { id: "other", name: "أخرى", icon: "➕", color: "#7D7568" },
];

const NEIGHBORHOODS = [
  "حي مزيان", "حي المحطة", "حي 100 مسكن", "حي المقبرة", "حي البناء الذاتي", "حي العقيد لطفي", "حي 300 سكن"
];

const catInfo = (id) => CATEGORIES.find((c) => c.id === id) || CATEGORIES[0];
const craftName = (c) => (c.cat === "other" && c.otherCat ? c.otherCat : catInfo(c.cat).name);

function Stars({ value }) {
  return (
    <span style={{ letterSpacing: "1px" }}>
      {[1, 2, 3, 4, 5].map((i) => (
        <span key={i} style={{ color: i <= Math.round(value || 0) ? "#D9A441" : "#D6D0C2", fontSize: 13 }}>★</span>
      ))}
    </span>
  );
}

function App() {
  const [list, setList] = useState(null);
  const [query, setQuery] = useState("");
  const [activeCat, setActiveCat] = useState(null);
  const [activeHood, setActiveHood] = useState("الكل");
  const [selected, setSelected] = useState(null);
  const [view, setView] = useState("home");
  const [toast, setToast] = useState(null);

  // إدخال الحرفي
  const [form, setForm] = useState({ id: null, name: "", email: "", cat: "plumb", otherCat: "", hood: NEIGHBORHOODS[0], exp: "5", phone: "", bio: "", galleryUrls: [] });
  const [isEditing, setIsEditing] = useState(false);
  const [step, setStep] = useState("form");
  const [otpGenerated, setOtpGenerated] = useState("");
  const [otpInput, setOtpInput] = useState("");
  const [saving, setSaving] = useState(false);
  const [formError, setFormError] = useState("");

  // لوحة الإدارة
  const [adminUnlocked, setAdminUnlocked] = useState(false);
  const [pinInput, setPinInput] = useState("");
  const [pinError, setPinError] = useState(false);

  // التقييمات داخل نافذة الحرفي
  const [newReviewerName, setNewReviewerName] = useState("");
  const [newCommentText, setNewCommentText] = useState("");
  const [newRatingVal, setNewRatingVal] = useState(5);
  const [isSubmittingReview, setIsSubmittingReview] = useState(false);

  // نظام التنقل وسجل المتصفح (زر الرجوع)
  const changeView = (newView) => {
    if (newView !== view) {
      window.history.pushState({ view: newView }, "");
      setView(newView);
      window.scrollTo(0, 0);
    }
  };

  useEffect(() => {
    if (!window.history.state) {
      window.history.replaceState({ view: "home" }, "");
    }
    const handlePopState = (event) => {
      if (event.state && event.state.view) {
        setView(event.state.view);
      } else {
        setView("home");
      }
    };
    window.addEventListener("popstate", handlePopState);
    return () => window.removeEventListener("popstate", handlePopState);
  }, []);

  const fetchList = async () => {
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/craftsmen?select=*&order=created_at.desc`, { headers: SB_HEADERS });
      const data = await res.json();
      if (Array.isArray(data)) {
        setList(data.map(r => ({
          id: r.id, name: r.name, email: r.email, cat: r.cat, otherCat: r.other_cat, hood: r.hood,
          exp: r.exp, phone: r.phone, bio: r.bio, status: r.status, rating: r.rating || 0, 
          reviews: r.reviews || 0, galleryUrls: r.gallery_urls || [], reviewList: r.review_list || []
        })));
      } else {
        setList([]);
      }
    } catch (e) {
      setList([]);
    }
  };

  useEffect(() => { fetchList(); }, []);

  const approved = useMemo(() => (list || []).filter((c) => c.status === "approved"), [list]);
  const pending = useMemo(() => (list || []).filter((c) => c.status === "pending"), [list]);

  const filtered = useMemo(() => {
    return approved.filter((c) => {
      const matchCat = activeCat ? c.cat === activeCat : true;
      const matchHood = activeHood === "الكل" ? true : c.hood === activeHood;
      const matchQuery = query ? c.name.includes(query) || craftName(c).includes(query) || c.bio.includes(query) : true;
      return matchCat && matchHood && matchQuery;
    });
  }, [approved, query, activeCat, activeHood]);

  const handleImageUpload = async (e) => {
    const files = Array.from(e.target.files);
    if (files.length === 0) return;
    setSaving(true);
    const newUrls = [...form.galleryUrls];
    try {
      for (let file of files) {
        const fileExt = file.name.split('.').pop();
        const fileName = `${Math.random().toString(36).substring(2)}_${Date.now()}.${fileExt}`;
        const res = await fetch(`${SUPABASE_URL}/storage/v1/object/public/craftsmen-gallery/${fileName}`, {
          method: "PUT",
          headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, "Content-Type": file.type },
          body: file
        });
        if (res.ok) {
          newUrls.push(`${SUPABASE_URL}/storage/v1/object/public/craftsmen-gallery/${fileName}`);
        }
      }
      setForm({ ...form, galleryUrls: newUrls });
    } catch (err) {}
    setSaving(false);
  };

  const handleStartRegister = (e) => {
    e.preventDefault();
    setFormError("");
    if (!form.name || !form.email || !form.phone || !form.bio) { setFormError("الرجاء ملء جميع الحقول المطلوبة"); return; }
    
    if (isEditing) {
      handleSaveUpdate();
      return;
    }

    const code = Math.floor(1000 + Math.random() * 9000).toString();
    setOtpGenerated(code);
    setSaving(true);

    emailjs.send("service_479y8v7", "template_g34j35l", {
      to_email: form.email,
      to_name: form.name,
      pass_code: code
    }).then(() => {
      setSaving(false);
      setStep("verify");
    }, () => {
      setSaving(false);
      setFormError("تعذّر إرسال رمز التحقق عبر البريد الإلكتروني");
    });
  };

  const handleVerifyAndSubmit = async () => {
    if (otpInput.trim() !== otpGenerated) {
      setFormError("رمز التحقق غير صحيح");
      return;
    }
    setSaving(true);
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/craftsmen`, {
        method: "POST",
        headers: { ...SB_HEADERS, Prefer: "return=minimal" },
        body: JSON.stringify({
          name: form.name, email: form.email, cat: form.cat, other_cat: form.otherCat || null,
          hood: form.hood, exp: form.exp, phone: form.phone, bio: form.bio, status: "pending",
          rating: 0, reviews: 0, gallery_urls: form.galleryUrls, review_list: []
        })
      });
      if (res.ok) {
        setToast("تم إرسال طلبك بنجاح وسيُنشر بعد المراجعة");
        changeView("home");
        setForm({ id: null, name: "", email: "", cat: "plumb", otherCat: "", hood: NEIGHBORHOODS[0], exp: "5", phone: "", bio: "", galleryUrls: [] });
        setStep("form");
        setIsEditing(false);
        fetchList();
      } else {
        setToast("حدث خطأ أثناء إرسال الطلب");
      }
    } catch (e) {
      setToast("تعذّر الاتصال بالخادم");
    }
    setSaving(false);
  };

  const handleSaveUpdate = async () => {
    setSaving(true);
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/craftsmen?id=eq.${form.id}`, {
        method: "PATCH",
        headers: SB_HEADERS,
        body: JSON.stringify({
          name: form.name, email: form.email, cat: form.cat, other_cat: form.otherCat || null,
          hood: form.hood, exp: form.exp, phone: form.phone, bio: form.bio, gallery_urls: form.galleryUrls
        })
      });
      if (res.ok) {
        setToast("تم تحديث بياناتك بنجاح!");
        changeView("home");
        setForm({ id: null, name: "", email: "", cat: "plumb", otherCat: "", hood: NEIGHBORHOODS[0], exp: "5", phone: "", bio: "", galleryUrls: [] });
        setIsEditing(false);
        fetchList();
      } else {
        setToast("حدث خطأ أثناء التحديث");
      }
    } catch (e) {
      setToast("تعذّر الاتصال بالخادم");
    }
    setSaving(false);
  };

  const handleDeleteAccount = async () => {
    if (!confirm("هل أنت متأكد من رغبتك في حذف ملفك نهائياً من المنصة؟")) return;
    setSaving(true);
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/craftsmen?id=eq.${form.id}`, {
        method: "DELETE",
        headers: SB_HEADERS
      });
      if (res.ok) {
        setToast("تم حذف ملفك نهائياً");
        changeView("home");
        setForm({ id: null, name: "", email: "", cat: "plumb", otherCat: "", hood: NEIGHBORHOODS[0], exp: "5", phone: "", bio: "", galleryUrls: [] });
        setIsEditing(false);
        fetchList();
      }
    } catch (e) {}
    setSaving(false);
  };

  const startEditProfile = () => {
    const emailToSearch = prompt("أدخل بريدك الإلكتروني المسجل في المنصة لتعديل بياناتك:");
    if (!emailToSearch) return;
    const found = (list || []).find(c => c.email && c.email.trim().toLowerCase() === emailToSearch.trim().toLowerCase());
    if (!found) {
      alert("عذراً، لم يتم العثور على حرفي بهذا البريد الإلكتروني.");
      return;
    }
    setForm({
      id: found.id, name: found.name, email: found.email, cat: found.cat, otherCat: found.otherCat || "",
      hood: found.hood, exp: found.exp, phone: found.phone, bio: found.bio, galleryUrls: found.galleryUrls || []
    });
    setIsEditing(true);
    setStep("form");
    changeView("register");
  };

  const submitReview = async () => {
    if (!newReviewerName || !newCommentText) return;
    setIsSubmittingReview(true);
    const updatedList = [...(selected.reviewList || []), { name: newReviewerName, comment: newCommentText, rating: newRatingVal, date: new Date().toLocaleDateString() }];
    const newCount = updatedList.length;
    const newAvg = Number((updatedList.reduce((acc, r) => acc + r.rating, 0) / newCount).toFixed(1));

    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/craftsmen?id=eq.${selected.id}`, {
        method: "PATCH",
        headers: SB_HEADERS,
        body: JSON.stringify({ review_list: updatedList, rating: newAvg, reviews: newCount })
      });
      if (res.ok) {
        const updatedObj = { ...selected, reviewList: updatedList, rating: newAvg, reviews: newCount };
        setSelected(updatedObj);
        setNewReviewerName("");
        setNewCommentText("");
        setToast("شكراً لتقييمك!");
        fetchList();
      }
    } catch (e) {}
    setIsSubmittingReview(false);
  };

  return (
    <div className="min-h-screen pb-20">
      <header className="sticky top-0 z-20 px-4 pt-5 pb-4 shadow-md bg-[#123B3B]">
        <div className="flex items-center justify-between">
          <div>
            <h1 className="text-white font-black text-xl leading-tight">حِرَفِي</h1>
            <p className="text-[11px] text-[#8FBFBF]">دليل الحرفيين والمهنيين لمدينة الدحموني</p>
          </div>
          <div className="flex items-center gap-2">
            <button onClick={() => changeView("admin")} className="w-10 h-10 rounded-full flex items-center justify-center text-white bg-[#D9A441] shadow text-base">⚙️</button>
          </div>
        </div>
      </header>

      {toast && (
        <div className="fixed top-20 left-1/2 -translate-x-1/2 z-50 bg-stone-900 text-white px-5 py-3 rounded-2xl shadow-xl text-xs font-bold flex items-center gap-3">
          <span>{toast}</span>
          <button onClick={() => setToast(null)} className="text-stone-400">✕</button>
        </div>
      )}

      {view === "home" && (
        <div className="p-4 max-w-lg mx-auto">
          <div className="relative mb-4">
            <input type="text" value={query} onChange={(e) => setQuery(e.target.value)} placeholder="ابحث عن حرفة، اسم، أو خدمة..."
              className="w-full h-12 pr-11 pl-4 rounded-xl text-sm border border-stone-200 bg-white shadow-sm focus:outline-none focus:ring-2 focus:ring-[#123B3B]" />
            <span className="absolute right-3.5 top-3.5 text-stone-400 text-lg">🔍</span>
          </div>

          <div className="flex justify-between items-center mb-4 bg-white p-3 rounded-2xl border border-stone-200 shadow-sm">
            <span className="text-xs font-bold text-stone-700">هل أنت حرفي؟</span>
            <div className="flex gap-2">
              <button onClick={() => { setIsEditing(false); setForm({ id: null, name: "", email: "", cat: "plumb", otherCat: "", hood: NEIGHBORHOODS[0], exp: "5", phone: "", bio: "", galleryUrls: [] }); changeView("register"); }} className="px-3 py-1.5 bg-[#123B3B] text-white rounded-xl text-xs font-bold">تسجيل جديد</button>
              <button onClick={startEditProfile} className="px-3 py-1.5 bg-stone-100 text-stone-700 rounded-xl text-xs font-bold border border-stone-200">تعديل بياناتي</button>
            </div>
          </div>

          <div className="grid grid-cols-3 gap-2.5 mb-6">
            {CATEGORIES.map((cat) => (
              <div key={cat.id} onClick={() => setActiveCat(activeCat === cat.id ? null : cat.id)}
                className={`p-3 rounded-2xl flex flex-col items-center text-center cursor-pointer transition border ${activeCat === cat.id ? 'border-[#123B3B] bg-[#E8F0EF] shadow-sm' : 'border-stone-200 bg-white'}`}>
                <span className="text-2xl mb-1">{cat.icon}</span>
                <span className="text-xs font-bold text-stone-800">{cat.name}</span>
              </div>
            ))}
          </div>

          <h3 className="font-bold text-stone-800 mb-3 text-sm">الحرفيون المتاحون</h3>
          {list === null ? (
            <div className="flex justify-center py-12"><div className="spinner"></div></div>
          ) : filtered.length === 0 ? (
            <div className="text-center py-12 text-stone-500 text-sm">لا توجد نتائج مطابقة</div>
          ) : (
            <div className="space-y-3">
              {filtered.map((c) => (
                <div key={c.id} onClick={() => setSelected(c)} className="p-4 bg-white rounded-2xl border border-stone-200 shadow-sm cursor-pointer flex justify-between items-center">
                  <div>
                    <div className="flex items-center gap-2 mb-1">
                      <span className="font-bold text-stone-900">{c.name}</span>
                      <span className="text-xs px-2 py-0.5 rounded-full text-white" style={{ background: catInfo(c.cat).color }}>{craftName(c)}</span>
                    </div>
                    <p className="text-xs text-stone-500 mb-2">📍 {c.hood} • {c.exp} سنوات خبرة</p>
                    <div className="flex items-center gap-2">
                      <Stars value={c.rating} />
                      <span className="text-[11px] text-stone-400">({c.reviews || 0} تقييم)</span>
                    </div>
                  </div>
                  <span className="text-stone-400 text-lg">←</span>
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      {view === "register" && (
        <div className="p-4 max-w-lg mx-auto">
          <h2 className="text-lg font-black text-[#123B3B] mb-4">{isEditing ? "تعديل بيانات الحرفي" : "تسجيل حرفي جديد"}</h2>
          {step === "form" ? (
            <form onSubmit={handleStartRegister} className="bg-white p-5 rounded-2xl border border-stone-200 shadow-sm space-y-4">
              {formError && <div className="p-3 bg-rose-50 text-rose-600 rounded-xl text-xs font-bold">{formError}</div>}
              <div>
                <label className="block text-xs font-bold text-stone-700 mb-1">الاسم الكامل</label>
                <input type="text" value={form.name} onChange={(e) => setForm({...form, name: e.target.value})} className="w-full h-11 px-3 rounded-xl border border-stone-200 text-sm" required />
              </div>
              <div>
                <label className="block text-xs font-bold text-stone-700 mb-1">البريد الإلكتروني</label>
                <input type="email" value={form.email} onChange={(e) => setForm({...form, email: e.target.value})} className="w-full h-11 px-3 rounded-xl border border-stone-200 text-sm" required />
              </div>
              <div>
                <label className="block text-xs font-bold text-stone-700 mb-1">الحرفة / التخصص</label>
                <select value={form.cat} onChange={(e) => setForm({...form, cat: e.target.value})} className="w-full h-11 px-3 rounded-xl border border-stone-200 text-sm bg-white">
                  {CATEGORIES.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                </select>
              </div>
              {form.cat === "other" && (
                <div>
                  <label className="block text-xs font-bold text-stone-700 mb-1">اكتب اسم الحرفة</label>
                  <input type="text" value={form.otherCat} onChange={(e) => setForm({...form, otherCat: e.target.value})} className="w-full h-11 px-3 rounded-xl border border-stone-200 text-sm" />
                </div>
              )}
              <div>
                <label className="block text-xs font-bold text-stone-700 mb-1">الحي / المنطقة</label>
                <select value={form.hood} onChange={(e) => setForm({...form, hood: e.target.value})} className="w-full h-11 px-3 rounded-xl border border-stone-200 text-sm bg-white">
                  {NEIGHBORHOODS.map(n => <option key={n} value={n}>{n}</option>)}
                </select>
              </div>
              <div>
                <label className="block text-xs font-bold text-stone-700 mb-1">رقم الهاتف</label>
                <input type="tel" value={form.phone} onChange={(e) => setForm({...form, phone: e.target.value})} placeholder="0550123456" className="w-full h-11 px-3 rounded-xl border border-stone-200 text-sm" required />
              </div>
              <div>
                <label className="block text-xs font-bold text-stone-700 mb-1">نبذة عن الخدمات المقدمة</label>
                <textarea value={form.bio} onChange={(e) => setForm({...form, bio: e.target.value})} rows="3" className="w-full p-3 rounded-xl border border-stone-200 text-sm" required></textarea>
              </div>
              <div>
                <label className="block text-xs font-bold text-stone-700 mb-1">صور الأعمال (اختياري)</label>
                <input type="file" multiple accept="image/*" onChange={handleImageUpload} className="w-full text-xs text-stone-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-[#123B3B] file:text-white" />
              </div>
              <button type="submit" disabled={saving} className="w-full py-3 bg-[#123B3B] text-white rounded-xl font-bold text-sm shadow-md">
                {saving ? "جاري المعالجة..." : (isEditing ? "حفظ التعديلات" : "إرسال رمز التحقق")}
              </button>
              {isEditing && (
                <button type="button" onClick={handleDeleteAccount} className="w-full py-3 bg-rose-600 text-white rounded-xl font-bold text-sm shadow-md mt-2">
                  حذف ملفي نهائياً
                </button>
              )}
            </form>
          ) : (
            <div className="bg-white p-6 rounded-2xl border border-stone-200 shadow-sm text-center">
              <h3 className="font-black text-stone-900 mb-2">التحقق من البريد الإلكتروني</h3>
              <p className="text-xs text-stone-600 mb-4">تم إرسال رمز التحقق إلى بريدك الإلكتروني. أدخله أدناه:</p>
              {formError && <div className="p-3 bg-rose-50 text-rose-600 rounded-xl text-xs font-bold mb-3">{formError}</div>}
              <input type="text" value={otpInput} onChange={(e) => setOtpInput(e.target.value)} placeholder="أدخل الرمز" className="w-full h-12 text-center text-lg tracking-widest rounded-xl border border-stone-200 mb-4 font-bold" />
              <button onClick={handleVerifyAndSubmit} disabled={saving} className="w-full py-3 bg-[#123B3B] text-white rounded-xl font-bold text-sm">
                {saving ? "جاري التسجيل..." : "تأكيد الرمز للمتابعة"}
              </button>
            </div>
          )}
        </div>
      )}

      {view === "admin" && (
        <div className="p-4 max-w-lg mx-auto">
          <h2 className="text-lg font-black text-[#123B3B] mb-4">لوحة المراجعة</h2>
          {!adminUnlocked ? (
            <div className="bg-white p-6 rounded-2xl border border-stone-200 shadow-sm">
              <p className="text-sm text-stone-600 mb-3">أدخل رمز الإدارة للمتابعة</p>
              <input type="password" value={pinInput} onChange={(e) => setPinInput(e.target.value)} placeholder="الرمز السري"
                className="w-full h-12 px-4 rounded-xl border border-stone-200 mb-3 text-sm focus:outline-none" />
              <button onClick={() => { if(pinInput === ADMIN_PIN) setAdminUnlocked(true); else setPinError(true); }}
                className="w-full h-11 bg-[#123B3B] text-white rounded-xl font-bold text-sm">دخول</button>
              {pinError && <p className="text-red-500 text-xs mt-2">رمز غير صحيح</p>}
            </div>
          ) : (
            <div>
              <p className="text-sm text-stone-600 mb-4">طلبات بانتظار المراجعة: {pending.length}</p>
              {pending.length === 0 ? (
                <p className="text-xs text-stone-400">لا توجد طلبات جديدة</p>
              ) : (
                pending.map((p) => (
                  <div key={p.id} className="bg-white p-4 rounded-2xl border border-stone-200 shadow-sm mb-3">
                    <h3 className="font-bold text-stone-900">{p.name} - {craftName(p)}</h3>
                    <p className="text-xs text-stone-500 mb-3">📍 {p.hood} • 📞 {p.phone}</p>
                    <div className="flex gap-2">
                      <button onClick={async () => {
                        await fetch(`${SUPABASE_URL}/rest/v1/craftsmen?id=eq.${p.id}`, { method: 'PATCH', headers: SB_HEADERS, body: JSON.stringify({ status: 'approved' }) });
                        fetchList();
                      }} className="flex-1 py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold">قبول ونشر</button>
                      <button onClick={async () => {
                        await fetch(`${SUPABASE_URL}/rest/v1/craftsmen?id=eq.${p.id}`, { method: 'DELETE', headers: SB_HEADERS });
                        fetchList();
                      }} className="flex-1 py-2 bg-rose-600 text-white rounded-xl text-xs font-bold">رفض</button>
                    </div>
                  </div>
                ))
              )}
            </div>
          )}
        </div>
      )}

      {selected && (
        <div className="fixed inset-0 z-50 bg-black/60 flex items-end sm:items-center justify-center p-0 sm:p-4">
          <div className="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-3xl p-6 max-h-[90vh] overflow-y-auto">
            <div className="flex justify-between items-start mb-4">
              <div>
                <h2 className="text-xl font-black text-stone-900">{selected.name}</h2>
                <p className="text-xs text-stone-500">📍 {selected.hood} • {selected.exp} سنوات خبرة</p>
              </div>
              <button onClick={() => setSelected(null)} className="w-8 h-8 rounded-full bg-stone-100 flex items-center justify-center text-stone-600 font-bold">✕</button>
            </div>
            <p className="text-sm text-stone-700 bg-stone-50 p-3 rounded-xl mb-4 leading-relaxed">{selected.bio}</p>
            
            {selected.galleryUrls && selected.galleryUrls.length > 0 && (
              <div className="mb-4">
                <h4 className="text-xs font-bold text-stone-700 mb-2">معرض الأعمال</h4>
                <div className="grid grid-cols-3 gap-2">
                  {selected.galleryUrls.map((url, i) => (
                    <img key={i} src={url} alt="work" className="w-full h-20 object-cover rounded-xl border border-stone-200" />
                  ))}
                </div>
              </div>
            )}

            <div className="flex gap-3 mb-6">
              <a href={`tel:${selected.phone}`} className="flex-1 py-3 rounded-xl bg-emerald-600 text-white font-bold text-sm text-center flex items-center justify-center gap-2">📞 اتصال</a>
              <a href={`https://wa.me/213${selected.phone.replace(/^0/, '')}`} target="_blank" rel="noreferrer" className="flex-1 py-3 rounded-xl bg-emerald-500 text-white font-bold text-sm text-center flex items-center justify-center gap-2">💬 واتساب</a>
            </div>

            <div className="border-t border-stone-100 pt-4">
              <h4 className="font-bold text-stone-800 text-sm mb-3">آراء والتقييمات</h4>
              <div className="space-y-2 mb-4 max-h-40 overflow-y-auto">
                {selected.reviewList && selected.reviewList.length > 0 ? (
                  selected.reviewList.map((rev, i) => (
                    <div key={i} className="p-3 bg-stone-50 rounded-xl text-xs">
                      <div className="flex justify-between font-bold text-stone-800 mb-1">
                        <span>{rev.name}</span>
                        <Stars value={rev.rating} />
                      </div>
                      <p className="text-stone-600">{rev.comment}</p>
                    </div>
                  ))
                ) : (
                  <p className="text-xs text-stone-400">لا توجد تقييمات بعد</p>
                )}
              </div>
              <div className="bg-stone-50 p-3 rounded-xl space-y-2">
                <h5 className="text-xs font-bold text-stone-700">إضافة تقييم وتعليق</h5>
                <input type="text" value={newReviewerName} onChange={(e) => setNewReviewerName(e.target.value)} placeholder="اسمك الكريم" className="w-full h-9 px-3 rounded-lg border border-stone-200 text-xs bg-white" />
                <textarea value={newCommentText} onChange={(e) => setNewCommentText(e.target.value)} placeholder="اكتب رأيك أو تجربتك..." rows="2" className="w-full p-2 rounded-lg border border-stone-200 text-xs bg-white"></textarea>
                <button onClick={submitReview} disabled={isSubmittingReview} className="w-full py-2 bg-[#123B3B] text-white rounded-lg text-xs font-bold">
                  {isSubmittingReview ? "جاري الإرسال..." : "إرسال التقييم"}
                </button>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* شريط التنقل السفلي مع زر الرجوع */}
      <nav className="fixed bottom-0 left-0 right-0 h-16 bg-white border-t border-stone-200 flex items-center justify-around z-10 px-6">
        <button onClick={() => window.history.back()} className="flex flex-col items-center gap-1 text-stone-500">
          <span className="text-lg">🔙</span>
          <span className="text-[10px]">رجوع</span>
        </button>
        <button onClick={() => changeView("home")} className={`flex flex-col items-center gap-1 ${view === 'home' ? 'text-[#123B3B] font-bold' : 'text-stone-400'}`}>
          <span className="text-lg">🏠</span>
          <span className="text-[10px]">الرئيسية</span>
        </button>
        <button onClick={() => { setIsEditing(false); setForm({ id: null, name: "", email: "", cat: "plumb", otherCat: "", hood: NEIGHBORHOODS[0], exp: "5", phone: "", bio: "", galleryUrls: [] }); changeView("register"); }} className={`flex flex-col items-center gap-1 ${view === 'register' ? 'text-[#123B3B] font-bold' : 'text-stone-400'}`}>
          <span className="text-lg">➕</span>
          <span className="text-[10px]">أنا حرفي</span>
        </button>
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
