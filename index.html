const catInfo = (id) => CATEGORIES.find((c) => c.id === id) || CATEGORIES[0];
const craftName = (c, lang) => (c.cat === "other" && c.otherCat ? c.otherCat : catInfo(c.cat).name[lang]);
const hoodName = (hoodAr, lang) => {
  const h = NEIGHBORHOODS.find((n) => n.ar === hoodAr);
  return h ? h[lang] : hoodAr;
};

const toDb = (c) => ({
  name: c.name, email: c.email || null, cat: c.cat, other_cat: c.otherCat || null, hood: c.hood,
  exp: Number(c.exp) || 0, phone: c.phone, bio: c.bio, status: c.status || "pending",
  rating: c.rating || 0, reviews: c.reviews || 0, gallery_urls: c.galleryUrls || [],
  review_list: c.reviewList || []
});

const fromDb = (r) => ({
  id: r.id, name: r.name, email: r.email, cat: r.cat, otherCat: r.other_cat, hood: r.hood,
  exp: r.exp, phone: r.phone, bio: r.bio, status: r.status, rating: r.rating, 
  reviews: r.reviews, galleryUrls: r.gallery_urls || [], reviewList: r.review_list || []
});

function Stars({ value }) {
  return (
    <span className="flex items-center gap-0.5">
      {[1, 2, 3, 4, 5].map((i) => (
        <span key={i} style={{ color: i <= Math.round(value || 0) ? "#D9A441" : "#D6D0C2" }} className="text-xs">★</span>
      ))}
    </span>
  );
}

// كرت الحرفي المصمم للهاتف
function CraftCard({ c, cat, lang, t, onClick }) {
  const formattedPhone = c.phone ? c.phone.replace(/\s+/g, '') : '';
  const waPhone = formattedPhone.startsWith('0') ? '213' + formattedPhone.slice(1) : formattedPhone;

  return (
    <div className="bg-white rounded-2xl p-4 shadow-sm border border-[#E8E3D5] flex flex-col justify-between transition-transform active:scale-[0.99]" onClick={onClick}>
      <div>
        <div className="flex items-start justify-between mb-2">
          <div className="flex items-center gap-3">
            <div className="w-12 h-12 rounded-2xl flex items-center justify-center text-xl shadow-inner" style={{ background: cat.color + "1A", border: `1.5px solid ${cat.color}33` }}>
              {cat.icon}
            </div>
            <div>
              <h3 className="font-bold text-[#123B3B] text-base leading-snug">{c.name}</h3>
              <p className="text-xs font-medium text-stone-500">{craftName(c, lang)} · <span className="text-[#D9A441] font-bold">{hoodName(c.hood, lang)}</span></p>
            </div>
          </div>
          <div className="flex flex-col items-end">
            <div className="flex items-center gap-1 bg-[#F5F2EA] px-2 py-0.5 rounded-full border border-[#E6E0D2]">
              <Stars value={c.rating} />
              <span className="text-[11px] font-black text-[#123B3B]">{c.rating ? c.rating.toFixed(1) : "جديد"}</span>
            </div>
          </div>
        </div>
        <p className="text-xs text-stone-600 line-clamp-2 my-2 leading-relaxed bg-[#FAF8F5] p-2.5 rounded-xl">{c.bio}</p>
      </div>

      <div className="flex items-center justify-between pt-2 border-t border-stone-100 mt-2" onClick={(e) => e.stopPropagation()}>
        <span className="text-[11px] text-stone-400 font-bold">خبرة: {c.exp} سنوات</span>
        <div className="flex items-center gap-2">
          <a href={`tel:${formattedPhone}`} className="bg-[#123B3B] text-white px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1 shadow-sm active:bg-[#1B4B4B]">
            📞 {t.call}
          </a>
          <a href={`https://wa.me/${waPhone}`} target="_blank" rel="noopener noreferrer" className="bg-[#25D366] text-white px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1 shadow-sm active:opacity-90">
            💬 {t.whatsapp}

}

function App() {
  const [lang, setLang] = useState("ar");
  const t = STRINGS[lang];
  const dir = lang === "ar" ? "rtl" : "ltr";

  const [list, setList] = useState(null);
  const [query, setQuery] = useState("");
  const [activeCat, setActiveCat] = useState(null);
  const [activeHood, setActiveHood] = useState(t.all);
  const [selected, setSelected] = useState(null);
  const [view, setView] = useState("home");
  const [toast, setToast] = useState(null);
  const [saving, setSaving] = useState(false);
  const [uploadingText, setUploadingText] = useState("");
  const [adminUnlocked, setAdminUnlocked] = useState(false);
  const [pinInput, setPinInput] = useState("");
  const [pinError, setPinError] = useState(false);
  const [editingCraftsman, setEditingCraftsman] = useState(null);

  useEffect(() => { setActiveHood(t.all); }, [lang]);

  const fetchList = async () => {
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/craftsmen?select=*&order=created_at.desc`, { headers: SB_HEADERS });
      const data = await res.json();
      setList(Array.isArray(data) ? data.map(fromDb) : []);
    } catch (e) {
      setList([]);
      setToast(t.toastFailConnect);
    }
  };

  useEffect(() => { fetchList(); }, []);

  const registerCraftsman = async (data) => {
    setSaving(true);
    let uploadedUrls = [];
    try {
      if (data.files && data.files.length > 0) {
        setUploadingText(t.uploadingImages);
        for (const file of data.files) {
          const ext = file.name.split('.').pop();
          const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${ext}`;
          const uploadRes = await fetch(`${SUPABASE_URL}/storage/v1/object/craftsmen-gallery/${fileName}`, {
            method: 'POST',
            headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, 'Content-Type': file.type },
            body: file
          });
          if (uploadRes.ok) {
            uploadedUrls.push(`${SUPABASE_URL}/storage/v1/object/public/craftsmen-gallery/${fileName}`);
          }
        }
        setUploadingText("");
      }

      const res = await fetch(`${SUPABASE_URL}/rest/v1/craftsmen`, {
        method: "POST",
        headers: { ...SB_HEADERS, Prefer: "return=representation" },
        body: JSON.stringify(toDb({ ...data, galleryUrls: uploadedUrls, status: "pending", rating: 0, reviews: 0, reviewList: [] })),
      });
      if (!res.ok) throw new Error("insert failed");

      await fetchList();
      setView("home");
      setToast(t.toastSubmitted);
      setTimeout(() => setToast(null), 3500);
    } catch (e) {
      setToast("خطأ: " + (e.message || "فشل التسجيل"));
      setUploadingText("");
    }
    setSaving(false);
  };

  const approveCraftsman = async (id) => {
    try {
      await fetch(`${SUPABASE_URL}/rest/v1/craftsmen?id=eq.${id}`, {
        method: "PATCH", headers: SB_HEADERS, body: JSON.stringify({ status: "approved" }),
      });
      await fetchList();
    } catch (e) { setToast(t.toastFailConnect); }
  };

  const rejectCraftsman = async (id) => {
    try {
      await fetch(`${SUPABASE_URL}/rest/v1/craftsmen?id=eq.${id}`, { method: "DELETE", headers: SB_HEADERS });
      await fetchList();
    } catch (e) { setToast(t.toastFailConnect); }
  };

  const approved = useMemo(() => (list || []).filter((c) => c.status === "approved"), [list]);
  const pending = useMemo(() => (list || []).filter((c) => c.status === "pending"), [list]);

  const filtered = useMemo(() => {
    return approved.filter((c) => {
      const matchCat = activeCat ? c.cat === activeCat : true;
      const matchHood = activeHood === t.all ? true : c.hood === activeHood;
      const matchQuery = query ? c.name.includes(query) || craftName(c, lang).includes(query) || c.bio.includes(query) : true;
      return matchCat && matchHood && matchQuery;
    }).sort((a, b) => (b.rating || 0) - (a.rating || 0));
  }, [approved, query, activeCat, activeHood, lang]);

  return (
    <div className="max-w-md mx-auto min-h-screen bg-[#F5F2EA] flex flex-col relative shadow-2xl overflow-hidden" dir={dir}>
      
      <!-- الهيدر العلوي الذكي للتطبيق -->
      <header className="sticky top-0 z-30 px-4 pt-4 pb-3 shadow-md" style={{ background: "#123B3B" }}>
        <div className="flex items-center justify-between mb-3">
          <div className="flex items-center gap-2">
            <div className="w-8 h-8 rounded-full bg-[#D9A441] flex items-center justify-center font-black text-white text-base">ح</div>
            <div>
              <h1 className="text-white font-black text-lg leading-none">{t.title}</h1>
              <p className="text-[10px] text-[#8FBFBF] mt-0.5">{t.subtitle}</p>
            </div>
          </div>
          <button onClick={() => setLang(lang === "ar" ? "en" : "ar")}
            className="px-3 py-1 rounded-full bg-[#1B4B4B] text-white text-xs font-bold border border-[#2C6E6E]">
            🌐 {lang === "ar" ? "EN" : "عربي"}
          </button>
        </div>

        {(view === "home" || view === "list") && (
          <div className="flex items-center gap-2 rounded-xl px-3 py-2 bg-[#1B4B4B] border border-[#2C6E6E]">
            <span>🔍</span>
            <input
              value={query}
              onChange={(e) => { setQuery(e.target.value); setView("list"); }}
              placeholder={t.searchPlaceholder}
              className="bg-transparent outline-none text-xs text-white placeholder-[#8FBFBF] w-full"
            />
          </div>
        )}
      </header>

      <!-- التوست الإشعاري السريع -->
      {toast && (
        <div className="fixed top-16 left-1/2 -translate-x-1/2 z-50 bg-[#123B3B] text-white text-xs px-4 py-2.5 rounded-full shadow-lg border border-[#D9A441] animate-bounce">
          {toast}
        </div>
      )}

      <!-- المحتوى الرئيسي للمشاهد المختلفة -->
      <main className="flex-1 px-4 safe-pb pt-3">
        {list === null ? (
          <div className="flex flex-col items-center justify-center py-20 text-stone-400 gap-2">
            <div className="spinner"></div>
            <span className="text-xs font-bold">{t.loading}</span>
          </div>
        ) : (
          <>
            {view === "home" && (
              <div>
                <!-- شريط الأحياء السريع -->
                <div className="flex gap-1.5 overflow-x-auto py-2 hide-scrollbar">
                  {[t.all, ...NEIGHBORHOODS.map((h) => h[lang])].map((h, idx) => {
                    const hoodValue = idx === 0 ? t.all : NEIGHBORHOODS[idx - 1].ar;
                    const isActive = activeHood === hoodValue;
                    return (
                      <button key={h} onClick={() => setActiveHood(hoodValue)} 
                        className={`whitespace-nowrap text-xs font-bold px-3 py-1.5 rounded-full border transition-all ${isActive ? 'bg-[#123B3B] text-white border-[#123B3B]' : 'bg-white text-[#123B3B] border-[#DCD5C4]'}`}>
                        {h}
                      </button>
                    );
                  })}
                </div>

                <!-- شبكة التصنيفات -->
                <h2 className="font-black text-[#123B3B] text-xs mb-3 mt-3 uppercase tracking-wider">{t.chooseCategory}</h2>
                <div className="grid grid-cols-4 gap-2.5 mb-5">
                  {CATEGORIES.map((c) => {
                    const count = approved.filter((x) => x.cat === c.id).length;
                    return (
                      <button key={c.id} onClick={() => { setActiveCat(c.id); setView("list"); }} className="flex flex-col items-center gap-1 active:scale-95 transition-transform">
                        <div className="w-14 h-14 rounded-2xl flex items-center justify-center shadow-sm relative" style={{ background: c.color + "15", border: `1.5px solid ${c.color}33` }}>
                          <span className="text-2xl">{c.icon}</span>
                          {count > 0 && <span className="absolute -top-1 -left-1 text-[9px] font-black text-white rounded-full w-4 h-4 flex items-center justify-center" style={{ background: c.color }}>{count}</span>}
                        </div>
                        <span className="text-[11px] font-bold text-stone-700">{c.name[lang]}</span>
                      </button>
                    );
                  })}
                </div>

                <!-- كروت الأعلى تقييماً -->
                <div className="flex items-center justify-between mb-3">
                  <h2 className="font-black text-[#123B3B] text-sm">{t.topRated}</h2>
                  <button onClick={() => setView("list")} className="text-xs font-bold text-[#D9A441]">{t.viewAll}</button>
                </div>

                <div className="space-y-3">
                  {approved.length === 0 ? (
                    <p className="text-center text-xs text-stone-400 py-6 bg-white rounded-2xl border border-dashed border-stone-300">{t.noCraftsmenYet}</p>
                  ) : (
                    [...approved].sort((a, b) => (b.rating || 0) - (a.rating || 0)).slice(0, 4).map((c) => (
                      <CraftCard key={c.id} c={c} cat={catInfo(c.cat)} lang={lang} t={t} onClick={() => setSelected(c)} />
                    ))
                  )}
                </div>
              </div>
            )}

            {view === "list" && (
              <div className="py-2">
                <div className="flex items-center gap-2 mb-3">
                  <button onClick={() => { setView("home"); setActiveCat(null); setQuery(""); }} className="w-8 h-8 rounded-full bg-white flex items-center justify-center font-bold text-[#123B3B] border border-stone-200">
                    {dir === "rtl" ? "➔" : "⬅"}
                  </button>
                  <h2 className="font-black text-[#123B3B] text-base flex-1">
                    {activeCat ? catInfo(activeCat).name[lang] : t.allCrafts}
                    <span className="text-xs font-normal text-stone-500"> ({filtered.length})</span>
                  </h2>
                </div>

                <div className="space-y-3">
                  {filtered.length === 0 ? (
                    <div className="text-center py-12 text-stone-400 bg-white rounded-2xl border border-stone-200">
                      <div className="text-3xl mb-2">🗂️</div>
                      <p className="text-xs font-bold">{t.noResults}</p>
                    </div>
                  ) : (
                    filtered.map((c) => (
                      <CraftCard key={c.id} c={c} cat={catInfo(c.cat)} lang={lang} t={t} onClick={() => setSelected(c)} />
                    ))
                  )}
                </div>
              </div>
            )}

            {view === "register" && (
              <RegisterForm onBack={() => setView("home")} onSubmit={registerCraftsman} saving={saving} uploadingText={uploadingText} t={t} lang={lang} />
            )}

            {view === "admin" && (
              <div className="py-2">
                <h2 className="font-black text-[#123B3B] text-base mb-4">{t.adminTitle}</h2>
                {!adminUnlocked ? (
                  <div className="bg-white rounded-2xl p-5 border border-stone-200 shadow-sm">
                    <p className="text-xs text-stone-600 font-bold mb-3">{t.adminPinPrompt}</p>
                    <input value={pinInput} onChange={(e) => { setPinInput(e.target.value); setPinError(false); }} type="password"
                      className="w-full border rounded-xl px-3 py-2.5 text-sm mb-3 outline-none"
                      style={{ borderColor: pinError ? "#C0392B" : "#DCD5C4" }} placeholder={t.adminPinPlaceholder} />
                    {pinError && <p className="text-[11px] text-red-600 font-bold mb-2">{t.adminPinWrong}</p>}
                    <button onClick={() => pinInput === ADMIN_PIN ? setAdminUnlocked(true) : setPinError(true)}
                      className="w-full py-3 rounded-xl font-bold text-white text-sm bg-[#123B3B] active:bg-[#1B4B4B]">{t.adminLogin}</button>
                  </div>
                ) : pending.length === 0 ? (
                  <div className="text-center py-12 text-stone-400 bg-white rounded-2xl">{t.adminNoPending}</div>
                ) : (
                  <div className="space-y-3">
                    {pending.map((c) => (
                      <div key={c.id} className="bg-white rounded-2xl p-4 border border-stone-200 shadow-sm">
                        <div className="flex items-center justify-between mb-2">
                          <span className="font-bold text-[#123B3B] text-sm">{c.name}</span>
                          <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-100 text-amber-800">قيد المراجعة</span>
                        </div>
                        <p className="text-xs text-stone-500 mb-1">{craftName(c, lang)} · {hoodName(c.hood, lang)} · {c.exp} {t.yearsExp}</p>
                        <p className="text-xs text-stone-700 bg-stone-50 p-2 rounded-xl mb-3">{c.bio}</p>
                        <div className="flex gap-2">
                          <button onClick={() => approveCraftsman(c.id)} className="flex-1 py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold">{t.approveBtn}</button>
                          <button onClick={() => rejectCraftsman(c.id)} className="flex-1 py-2 bg-rose-600 text-white rounded-xl text-xs font-bold">{t.rejectBtn}</button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}
          </>
        )}
      </main>

      <!-- شريط التنقل السفلي المخصص للموبايل Tab Bar -->
      <nav className="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white border-t border-stone-200 flex items-center justify-around py-2 z-40 shadow-lg">
        <button onClick={() => setView("home")} className={`flex flex-col items-center gap-0.5 ${view === "home" ? "text-[#123B3B]" : "text-stone-400"}`}>
          <span className="text-xl">🏠</span>
          <span className="text-[10px] font-bold">{t.navHome}</span>
        </button>
        <button onClick={() => setView("list")} className={`flex flex-col items-center gap-0.5 ${view === "list" ? "text-[#123B3B]" : "text-stone-400"}`}>
          <span className="text-xl">🔍</span>
          <span className="text-[10px] font-bold">{t.navSearch}</span>
        </button>
        <button onClick={() => setView("register")} className={`flex flex-col items-center gap-0.5 ${view === "register" ? "text-[#D9A441]" : "text-stone-400"}`}>
          <span className="text-xl">➕</span>
          <span className="text-[10px] font-bold">{t.navRegister}</span>
        </button>
        <button onClick={() => setView("admin")} className={`flex flex-col items-center gap-0.5 ${view === "admin" ? "text-[#123B3B]" : "text-stone-400"}`}>
          <span className="text-xl">⚙️</span>
          <span className="text-[10px] font-bold">{t.navAdmin}</span>
        </button>
      </nav>

      <!-- نافذة تفاصيل الحرفي المكتملة Modal -->
      {selected && (
        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4" onClick={() => setSelected(null)}>
          <div className="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 max-h-[85vh] overflow-y-auto" onClick={(e) => e.stopPropagation()}>
            <div className="w-12 h-1.5 bg-stone-300 rounded-full mx-auto mb-4"></div>
            <div className="flex items-center gap-3 mb-4">
              <div className="w-14 h-14 rounded-2xl bg-[#123B3B]/10 flex items-center justify-center text-2xl">
                {catInfo(selected.cat).icon}
              </div>
              <div>
                <h2 className="font-black text-[#123B3B] text-lg">{selected.name}</h2>
                <p className="text-xs text-stone-500">{craftName(selected, lang)} · {hoodName(selected.hood, lang)}</p>
              </div>
            </div>

            <p className="text-xs text-stone-700 bg-[#F5F2EA] p-3 rounded-2xl mb-4 leading-relaxed">{selected.bio}</p>

            {selected.galleryUrls && selected.galleryUrls.length > 0 && (
              <div className="mb-4">
                <h4 className="text-xs font-bold text-stone-700 mb-2">{t.galleryTitle}</h4>
                <div className="flex gap-2 overflow-x-auto pb-2 hide-scrollbar">
                  {selected.galleryUrls.map((url, i) => (
                    <img key={i} src={url} className="w-24 h-24 object-cover rounded-xl border border-stone-200" />
                  ))}
                </div>
              </div>
            )}

            <div className="flex gap-2 pt-2 border-t border-stone-100">
              <a href={`tel:${selected.phone}`} className="flex-1 py-3 bg-[#123B3B] text-white text-center rounded-xl text-xs font-bold">{t.call}</a>
              <button onClick={() => setSelected(null)} className="px-4 py-3 bg-stone-100 text-stone-600 rounded-xl text-xs font-bold">إغلاق</button>
            </div>
          </div>
        </div>
      )}

    </div>
  );
}

// نموذج التسجيل المحسّن
function RegisterForm({ onBack, onSubmit, saving, uploadingText, t, lang }) {
  const [form, setForm] = useState({ name: "", cat: CATEGORIES[0].id, otherCat: "", hood: NEIGHBORHOODS[0].ar, exp: 1, phone: "", bio: "", files: [] });

  const handleSubmit = (e) => {
    e.preventDefault();
    if (!form.name || !form.phone || !form.bio) return alert(t.requiredError);
    onSubmit(form);
  };

  return (
    <form onSubmit={handleSubmit} className="space-y-3 py-2">
      <h2 className="font-black text-[#123B3B] text-base mb-2">{t.registerTitle}</h2>
      
      <div>
        <label className="text-xs font-bold text-stone-600">{t.fullName}</label>
        <input value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} className="w-full bg-white border border-stone-200 rounded-xl p-2.5 text-xs outline-none" required />
      </div>

      <div className="grid grid-cols-2 gap-2">
        <div>
          <label className="text-xs font-bold text-stone-600">{t.craft}</label>
          <select value={form.cat} onChange={(e) => setForm({ ...form, cat: e.target.value })} className="w-full bg-white border border-stone-200 rounded-xl p-2.5 text-xs outline-none">
            {CATEGORIES.map((c) => <option key={c.id} value={c.id}>{c.name[lang]}</option>)}
          </select>
        </div>
        <div>
          <label className="text-xs font-bold text-stone-600">{t.neighborhood}</label>
          <select value={form.hood} onChange={(e) => setForm({ ...form, hood: e.target.value })} className="w-full bg-white border border-stone-200 rounded-xl p-2.5 text-xs outline-none">
            {NEIGHBORHOODS.map((n) => <option key={n.ar} value={n.ar}>{n[lang]}</option>)}
          </select>
        </div>
      </div>

      <div>
        <label className="text-xs font-bold text-stone-600">{t.phone}</label>
        <input value={form.phone} onChange={(e) => setForm({ ...form, phone: e.target.value })} placeholder="0550123456" className="w-full bg-white border border-stone-200 rounded-xl p-2.5 text-xs outline-none" required />
      </div>

      <div>
        <label className="text-xs font-bold text-stone-600">{t.bio}</label>
        <textarea value={form.bio} onChange={(e) => setForm({ ...form, bio: e.target.value })} rows="3" className="w-full bg-white border border-stone-200 rounded-xl p-2.5 text-xs outline-none" required />
      </div>

      <div>
        <label className="text-xs font-bold text-stone-600">{t.chooseImages}</label>
        <input type="file" multiple accept="image/*" onChange={(e) => setForm({ ...form, files: Array.from(e.target.files) })} className="w-full bg-white border border-stone-200 rounded-xl p-2 text-xs" />
      </div>

      <button type="submit" disabled={saving} className="w-full py-3 bg-[#D9A441] text-white rounded-xl text-xs font-bold shadow-md active:opacity-90">
        {saving ? (uploadingText || t.submitting) : t.submitBtn}
      </button>
    </form>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
