<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>حرفي - دليل الحرفيين والمهنيين</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Google Fonts (Tajawal) -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [currentTab, setCurrentTab] = React.useState('home');
            const [searchQuery, setSearchQuery] = React.useState('');

            // قائمة تجريبية للحرفيين
            const artisans = [
                { id: 1, name: 'محمد أمين', profession: 'كهربائي بناء وصيانة', phone: '0550123456', rating: 4.8, city: 'الجزائر' },
                { id: 2, name: 'إبراهيم خليل', profession: 'سباك وصحي', phone: '0661987654', rating: 4.9, city: 'الجزائر' },
                { id: 3, name: 'عبد القادر بن عيسى', profession: 'نجاب أثاث وتصميم', phone: '0770554433', rating: 4.7, city: 'الجزائر' },
                { id: 4, name: 'سمير بوعلام', profession: 'مصلح مكيفات وأجهزة', phone: '0540112233', rating: 4.6, city: 'الجزائر' }
            ];

            const filteredArtisans = artisans.filter(item => 
                item.name.includes(searchQuery) || item.profession.includes(searchQuery)
            );

            return (
                <div className="flex flex-col h-screen max-w-md mx-auto bg-white shadow-xl overflow-hidden border-x border-slate-200">
                    
                    {/* رأس التطبيق (Header) */}
                    <header className="bg-emerald-600 text-white p-4 shadow-md flex justify-between items-center">
                        <div>
                            <h1 className="text-xl font-extrabold tracking-wide">منصة حِرَفِي</h1>
                            <p className="text-xs text-emerald-100">دليلك الموثوق للمهنيين والحرفيين</p>
                        </div>
                        <span className="bg-emerald-700 text-xs px-2.5 py-1 rounded-full font-medium">نسخة التجربة</span>
                    </header>

                    {/* محتوى الشاشات */}
                    <main className="flex-1 overflow-y-auto p-4 bg-slate-50">
                        {currentTab === 'home' && (
                            <div className="space-y-4">
                                {/* شريط البحث */}
                                <div className="relative">
                                    <input 
                                        type="text" 
                                        placeholder="ابحث عن حرفي، كهربائي، سباك..." 
                                        value={searchQuery}
                                        onChange={(e) => setSearchQuery(e.target.value)}
                                        className="w-full p-3 pr-10 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white text-sm shadow-sm"
                                    />
                                    <span className="absolute right-3 top-3.5 text-slate-400">🔍</span>
                                </div>

                                {/* إعلان ترحيبي */}
                                <div className="bg-gradient-to-r from-emerald-500 to-teal-600 rounded-2xl p-4 text-white shadow-sm">
                                    <h2 className="font-bold text-lg mb-1">هل تبحث عن حرفي ماهر؟</h2>
                                    <p className="text-xs text-emerald-100 leading-relaxed">تصفح قائمة المهنيين المعتمدين وتواصل معهم مباشرة بضغطة زر واحدة.</p>
                                </div>

                                {/* قائمة الحرفيين */}
                                <div>
                                    <h3 className="font-bold text-slate-700 mb-3 text-sm">أبرز الحرفيين المتاحين</h3>
                                    <div className="space-y-3">
                                        {filteredArtisans.map(artisan => (
                                            <div key={artisan.id} className="bg-white p-4 rounded-xl border border-slate-100 shadow-sm flex justify-between items-center hover:shadow-md transition">
                                                <div>
                                                    <h4 className="font-bold text-slate-800 text-base">{artisan.name}</h4>
                                                    <p className="text-xs text-emerald-600 font-medium mt-0.5">{artisan.profession}</p>
                                                    <div className="flex items-center gap-2 mt-2 text-xs text-slate-500">
                                                        <span>📍 {artisan.city}</span>
                                                        <span>⭐ {artisan.rating}</span>
                                                    </div>
                                                </div>
                                                <a 
                                                    href={`tel:${artisan.phone}`} 
                                                    className="bg-emerald-50 text-emerald-600 hover:bg-emerald-600 hover:text-white p-2.5 rounded-xl transition text-sm font-bold flex items-center justify-center shadow-sm"
                                                    title="اتصال"
                                                >
                                                    📞
                                                </a>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {currentTab === 'add' && (
                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-4">
                                <h2 className="font-bold text-lg text-slate-800">تسجيل حرفي جديد</h2>
                                <p className="text-xs text-slate-500">أدخل معلوماتك ليتم إضافتك إلى الدليل العام.</p>
                                
                                <div className="space-y-3">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 mb-1">الاسم الكامل</label>
                                        <input type="text" className="w-full p-2.5 rounded-lg border border-slate-200 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="مثال: أحمد بن محمد" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 mb-1">الحرفة / الاختصاص</label>
                                        <input type="text" className="w-full p-2.5 rounded-lg border border-slate-200 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="مثال: تركيب مطابخ / تبريد" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 mb-1">رقم الهاتف</label>
                                        <input type="tel" className="w-full p-2.5 rounded-lg border border-slate-200 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="05xxxxxxxx" />
                                    </div>
                                    <button 
                                        onClick={() => alert('تم إرسال طلب التسجيل بنجاح!')}
                                        className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold p-3 rounded-xl transition text-sm shadow-md mt-2"
                                    >
                                        إرسال الطلب
                                    </button>
                                </div>
                            </div>
                        )}

                        {currentTab === 'profile' && (
                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 text-center space-y-3">
                                <div className="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-3xl mx-auto font-bold">
                                    ح
                                </div>
                                <h2 className="font-bold text-lg text-slate-800">منصة حِرَفِي</h2>
                                <p className="text-xs text-slate-500 leading-relaxed">
                                    التطبيق الرسمي للربط بين المواطنين والحرفيين المهرة لتقديم الخدمات المنزلية والتقنية بكل سهولة وسرعة.
                                </p>
                                <div className="pt-4 border-t border-slate-100 text-xs text-slate-400">
                                    الإصدار التجريبي 1.0.0
                                </div>
                            </div>
                        )}
                    </main>

                    {/* شريط التنقل السفلي (Bottom Navigation) */}
                    <nav className="bg-white border-t border-slate-200 flex justify-around p-2 shadow-lg">
                        <button 
                            onClick={() => setCurrentTab('home')}
                            className={`flex flex-col items-center flex-1 py-1 text-xs font-bold transition ${currentTab === 'home' ? 'text-emerald-600' : 'text-slate-400 hover:text-slate-600'}`}
                        >
                            <span className="text-lg">🏠</span>
                            الرئيسية
                        </button>
                        <button 
                            onClick={() => setCurrentTab('add')}
                            className={`flex flex-col items-center flex-1 py-1 text-xs font-bold transition ${currentTab === 'add' ? 'text-emerald-600' : 'text-slate-400 hover:text-slate-600'}`}
                        >
                            <span className="text-lg">➕</span>
                            انضم كحرفي
                        </button>
                        <button 
                            onClick={() => setCurrentTab('profile')}
                            className={`flex flex-col items-center flex-1 py-1 text-xs font-bold transition ${currentTab === 'profile' ? 'text-emerald-600' : 'text-slate-400 hover:text-slate-600'}`}
                        >
                            <span className="text-lg">👤</span>
                            حول التطبيق
                        </button>
                    </nav>

                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
