<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>حرفي</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Google Fonts (Tajawal) -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 flex justify-center items-center min-h-screen m-0 p-0">

    <div id="root" class="w-full max-w-md bg-[#182232] min-h-screen flex flex-col shadow-2xl overflow-hidden"></div>

    <script type="text/babel">
        function App() {
            const [isLoginView, setIsLoginView] = React.useState(false); 
            const [userType, setUserType] = React.useState('user'); 

            // الحقول الأساسية
            const [username, setUsername] = React.useState('');
            const [phone, setPhone] = React.useState('');
            const [email, setEmail] = React.useState('');
            const [password, setPassword] = React.useState('');
            const [confirmPassword, setConfirmPassword] = React.useState('');

            const handleSubmit = (e) => {
                e.preventDefault();
                
                // التحقق من تطابق كلمات المرور في حالة إنشاء حساب جديد
                if (!isLoginView && password !== confirmPassword) {
                    alert('كلمتا المرور غير متطابقتين!');
                    return;
                }

                alert(isLoginView ? 'تم تسجيل الدخول بنجاح!' : 'تم إنشاء الحساب بنجاح!');
            };

            return (
                <div className="flex flex-col flex-1 bg-[#182232]">
                    
                    {/* القسم العلوي والشعار */}
                    <div className="pt-8 pb-10 px-6 text-center flex flex-col items-center">
                        <div className="w-24 h-24 bg-white rounded-2xl p-2 shadow-lg border-2 border-slate-700 flex items-center justify-center">
                            <div className="text-center">
                                <span className="text-3xl">👨‍🔧</span>
                                <div className="text-slate-800 font-extrabold text-sm tracking-wider mt-1">حرفي</div>
                            </div>
                        </div>
                    </div>

                    {/* القسم السفلي */}
                    <div className="flex-1 bg-[#F2F3F5] rounded-t-[35px] px-6 pt-6 pb-8 flex flex-col justify-between shadow-inner">
                        
                        <form onSubmit={handleSubmit} className="flex flex-col flex-1 justify-between">
                            <div>
                                {/* أزرار التبديل */}
                                <div className="flex items-center justify-between mb-6">
                                    <button 
                                        type="button"
                                        onClick={() => setIsLoginView(true)}
                                        className={`text-lg font-bold transition ${isLoginView ? 'text-slate-800 border-b-2 border-slate-800 pb-1' : 'text-slate-400'}`}
                                    >
                                        تسجيل الدخول
                                    </button>
                                    <button 
                                        type="button"
                                        onClick={() => setIsLoginView(false)}
                                        className={`bg-[#2C3847] text-white px-5 py-2 rounded-full text-sm font-bold shadow-md transition ${!isLoginView ? '' : 'opacity-70'}`}
                                    >
                                        حساب جديد
                                    </button>
                                </div>

                                {/* اختيار نوع الحساب */}
                                <div className="flex items-center justify-center gap-8 mb-6 bg-white py-3 px-4 rounded-xl shadow-sm border border-slate-200">
                                    <label className="flex items-center gap-2 cursor-pointer text-sm font-bold text-slate-700">
                                        <input 
                                            type="radio" 
                                            name="userType" 
                                            checked={userType === 'user'} 
                                            onChange={() => setUserType('user')}
                                            className="w-4 h-4 accent-[#EAB308]"
                                        />
                                        مستخدم
                                    </label>
                                    <label className="flex items-center gap-2 cursor-pointer text-sm font-bold text-slate-700">
                                        <input 
                                            type="radio" 
                                            name="userType" 
                                            checked={userType === 'provider'} 
                                            onChange={() => setUserType('provider')}
                                            className="w-4 h-4 accent-[#EAB308]"
                                        />
                                        مقدم خدمة
                                    </label>
                                </div>

                                {/* الحقول كاملة */}
                                <div className="space-y-4">
                                    
                                    <div className="relative">
                                        <input 
                                            type="text" 
                                            placeholder="إسم المستخدم"
                                            value={username}
                                            onChange={(e) => setUsername(e.target.value)}
                                            required
                                            className="w-full bg-white py-3.5 pr-12 pl-4 rounded-xl border border-slate-200 text-sm text-slate-700 placeholder-slate-400 focus:outline-none focus:border-[#EAB308] shadow-sm"
                                        />
                                        <span className="absolute right-4 top-3.5 text-[#EAB308] text-lg">👤</span>
                                    </div>

                                    <div className="relative">
                                        <input 
                                            type="tel" 
                                            placeholder="رقم الجوال"
                                            value={phone}
                                            onChange={(e) => setPhone(e.target.value)}
                                            required
                                            className="w-full bg-white py-3.5 pr-12 pl-4 rounded-xl border border-slate-200 text-sm text-slate-700 placeholder-slate-400 focus:outline-none focus:border-[#EAB308] shadow-sm"
                                        />
                                        <span className="absolute right-4 top-3.5 text-[#EAB308] text-lg">📱</span>
                                    </div>

                                    <div className="relative">
                                        <input 
                                            type="email" 
                                            placeholder="البريد الإلكتروني"
                                            value={email}
                                            onChange={(e) => setEmail(e.target.value)}
                                            required={!isLoginView}
                                            className="w-full bg-white py-3.5 pr-12 pl-4 rounded-xl border border-slate-200 text-sm text-slate-700 placeholder-slate-400 focus:outline-none focus:border-[#EAB308] shadow-sm"
                                        />
                                        <span className="absolute right-4 top-3.5 text-[#EAB308] text-lg">✉️</span>
                                    </div>

                                    <div className="relative">
                                        <input 
                                            type="password" 
                                            placeholder="كلمة المرور"
                                            value={password}
                                            onChange={(e) => setPassword(e.target.value)}
                                            required={!isLoginView}
                                            className="w-full bg-white py-3.5 pr-12 pl-4 rounded-xl border border-slate-200 text-sm text-slate-700 placeholder-slate-400 focus:outline-none focus:border-[#EAB308] shadow-sm"
                                        />
                                        <span className="absolute right-4 top-3.5 text-[#EAB308] text-lg">🔒</span>
                                    </div>

                                    {!isLoginView && (
                                        <div className="relative">
                                            <input 
                                                type="password" 
                                                placeholder="تأكيد كلمة المرور"
                                                value={confirmPassword}
                                                onChange={(e) => setConfirmPassword(e.target.value)}
                                                required
                                                className="w-full bg-white py-3.5 pr-12 pl-4 rounded-xl border border-slate-200 text-sm text-slate-700 placeholder-slate-400 focus:outline-none focus:border-[#EAB308] shadow-sm"
                                            />
                                            <span className="absolute right-4 top-3.5 text-[#EAB308] text-lg">🔒</span>
                                        </div>
                                    )}

                                </div>
                            </div>

                            {/* زر الإرسال والشروط */}
                            <div className="mt-6 space-y-4">
                                <button 
                                    type="submit"
                                    className="w-full bg-[#2C3847] hover:bg-slate-800 text-white font-bold py-3.5 rounded-xl transition shadow-md text-sm"
                                >
                                    {isLoginView ? 'تسجيل الدخول' : 'إتمام التسجيل'}
                                </button>

                                <div className="flex items-center justify-between">
                                    <div className="flex items-center gap-2">
                                        <input 
                                            type="checkbox" 
                                            id="terms" 
                                            className="w-4 h-4 accent-[#2C3847] rounded cursor-pointer"
                                        />
                                        <label htmlFor="terms" className="text-xs text-slate-600 font-medium">
                                            الموافقة على الشروط والأحكام
                                        </label>
                                    </div>
                                    <span className="text-xs text-blue-600 underline cursor-pointer">الشروط</span>
                                </div>
                            </div>

                        </form>

                    </div>

                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
