const catInfo = (id) => CATEGORIES.find((c) => c.id === id) || CATEGORIES[0];
const craftName = (c, lang) => (c.cat === "other" && c.otherCat ? c.otherCat : catInfo(c.cat).name[lang]);
const hoodName = (hoodAr, lang) => {
  const h = NEIGHBORHOODS.find((n) => n.ar === hoodAr);
  return h ? h[lang] : hoodAr;
};

const toDb = (c) => ({
  name: c.name, cat: c.cat, other_cat: c.otherCat || null, hood: c.hood,
  exp: c.exp, phone: c.phone, bio: c.bio, status: c.status || "pending",
  rating: c.rating || 0, reviews: c.reviews || 0, gallery_urls: c.galleryUrls || []
});
const fromDb = (r) => ({
  id: r.id, name: r.name, cat: r.cat, otherCat: r.other_cat, hood: r.hood,
  exp: r.exp, phone: r.phone, bio: r.bio, status: r.status, rating: r.rating, 
  reviews: r.reviews, galleryUrls: r.gallery_urls || []
});

function Stars({ value }) {
  return (
    <div className="flex items-center gap-0.5">
      {[1, 2, 3, 4, 5].map((i) => (
        <span key={i} className={`text-xs ${i <= Math.round(value || 0) ? "text-amber-500" : "text-stone-300"}`}>★</span>
      ))}
    </div>
  );
}

function RatingInput({ onRate }) {
  const [hover, setHover] = useState(0);
  const [done, setDone] = useState(false);
  if (done) return null;
  return (
    <div className="flex gap-1 text-2xl cursor-pointer">
      {[1, 2, 3, 4, 5].map((i) => (
        <span key={i}
          onMouseEnter={() => setHover(i)}
          onMouseLeave={() => setHover(0)}
          onClick={() => { onRate(i); setDone(true); }}
          className={`transition transform hover:scale-125 ${i <= hover ? "text-amber-500" : "text-stone-300"}`}>★</span>
      ))}
    </div>
  );
}

function App() {
  const [lang, setLang] = useState("ar");
  const t = STRINGS[lang];
  const dir = lang === "ar" ? "rtl" : "ltr";

  const [list, setList] = useState(null);
  const [query, setQuery] = useState("");
  const [activeCat, setActiveCat] = useState(null);
  const [activeHood, setActiveHood] = useState(t.all);
  const [selected, setSelected] = useState(null);
  const [view, setView] = useState("home");
  const [toast, setToast] = useState(null);
  const [saving, setSaving] = useState(false);
  const [uploadingText, setUploadingText] = useState("");
  const [adminUnlocked, setAdminUnlocked] = useState(false);
  const [pinInput, setPinInput] = useState("");
  const [pinError, setPinError] = useState(false);

  useEffect(() => { setActiveHood(t.all); }, [lang]);
  useEffect(() => { document.documentElement.setAttribute("dir", dir); document.documentElement.setAttribute("lang", lang); }, [dir, lang]);

  const fetchList = async () => {
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/craftsmen?select=*&order=created_at.desc`, { headers: SB_HEADERS });
      const data = await res.json();
      setList(Array.isArray(data) ? data.map(fromDb) : []);
    } catch (e) {
      setList([]);
      setToast(t.toastFailConnect);
    }
  };

  useEffect(() => { fetchList(); }, []);

  const registerCraftsman = async (data) => {
    setSaving(true);
    let uploadedUrls = [];
    try {
      if (data.files && data.files.length > 0) {
        setUploadingText(t.uploadingImages);
        for (const file of data.files) {
          const ext = file.name.split('.').pop();
          const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${ext}`;
          const uploadRes = await fetch(`${SUPABASE_URL}/storage/v1/object/craftsmen-gallery/${fileName}`, {
            method: 'POST',
            headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, 'Content-Type': file.type },
            body: file
          });
          if (uploadRes.ok) {
            uploadedUrls.push(`${SUPABASE_URL}/storage/v1/object/public/craftsmen-gallery/${fileName}`);
          }
        }
        setUploadingText("");
      }

      const res = await fetch(`${SUPABASE_URL}/rest/v1/craftsmen`, {
        method: "POST",
        headers: { ...SB_HEADERS, Prefer: "return=representation" },
        body: JSON.stringify(toDb({ ...data, galleryUrls: uploadedUrls, status: "pending", rating: 0, reviews: 0 })),
      });
      if (!res.ok) throw new Error("insert failed");

      try {
        const selectedCat = CATEGORIES.find(c => c.id === data.cat);
        const craftTitle = data.cat === "other" ? data.otherCat : (selectedCat ? selectedCat.name.ar : data.cat);
        const imagesNote = uploadedUrls.length > 0 ? `\n📸 **مرفق:** ${uploadedUrls.length} صور للأعمال` : "";
        const telegramMessage = `🛠 **طلب تسجيل حرفي جديد!**\n\n` +
                                `👤 **الاسم:** ${data.name}\n` +
                                `📞 **الهاتف:** ${data.phone}\n` +
                                `🧰 **الحرفة:** ${craftTitle}\n` +
                                `📍 **المنطقة:** ${data.hood}\n` +
                                `⭐ **الخبرة:** ${data.exp} سنوات\n` +
                                `📝 **النبذة:** ${data.bio}` + imagesNote;

        fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: telegramMessage, parse_mode: "Markdown" })
        });
      } catch (tgError) { console.error(tgError); }

      await fetchList();
      setView("home");
      setToast(t.toastSubmitted);
      setTimeout(() => setToast(null), 4000);
    } catch (e) {
      setToast(t.toastFailSubmit);
      setUploadingText("");
    }
    setSaving(false);
  };

  const approveCraftsman = async (id) => {
    try {
      await fetch(`${SUPABASE_URL}/rest/v1/craftsmen?id=eq.${id}`, {
        method: "PATCH", headers: SB_HEADERS, body: JSON.stringify({ status: "approved" }),
      });
      await fetchList();
    } catch (e) { setToast(t.toastFailConnect); }
  };

  const rejectCraftsman = async (id) => {
    try {
      await fetch(`${SUPABASE_URL}/rest/v1/craftsmen?id=eq.${id}`, { method: "DELETE", headers: SB_HEADERS });
      await fetchList();
    } catch (e) { setToast(t.toastFailConnect); }
  };

  const rateCraftsman = async (craftsman, value) => {
    const newReviews = (craftsman.reviews || 0) + 1;
    const newRating = (((craftsman.rating || 0) * (craftsman.reviews || 0)) + value) / newReviews;
    try {
      await fetch(`${SUPABASE_URL}/rest/v1/craftsmen?id=eq.${craftsman.id}`, {
        method: "PATCH", headers: SB_HEADERS,
        body: JSON.stringify({ rating: newRating, reviews: newReviews }),
      });
      await fetchList();
      setToast(t.thanksRating);
      setTimeout(() => setToast(null), 3000);
    } catch (e) { setToast(t.toastFailConnect); }
  };

  const shareCraftsman = (c) => {
    const url = `${window.location.href.split("?")[0]}?craftsman=${c.id}`;
    if (navigator.share) {
      navigator.share({ title: c.name, text: craftName(c, lang), url });
    } else {
      navigator.clipboard.writeText(url);
      setToast(t.shareCopied);
      setTimeout(() => setToast(null), 2500);
    }
  };

  const approved = useMemo(() => (list || []).filter((c) => c.status === "approved"), [list]);
  const pending = useMemo(() => (list || []).filter((c) => c.status === "pending"), [list]);

  const filtered = useMemo(() => {
    return approved.filter((c) => {
      const matchCat = activeCat ? c.cat === activeCat : true;
      const matchHood = activeHood === t.all ? true : c.hood === activeHood;
      const matchQuery = query ? c.name.includes(query) || craftName(c, lang).includes(query) || c.bio.includes(query) : true;
      return matchCat && matchHood && matchQuery;
    }).sort((a, b) => (b.rating || 0) - (a.rating || 0));
  }, [approved, query, activeCat, activeHood, lang]);

  return (
    <div className="min-h-screen flex flex-col max-w-lg mx-auto bg-[#F8F7F4] shadow-2xl relative pb-20" dir={dir}>
      <header className="glass-header sticky top-0 z-30 px-5 pt-6 pb-5 text-white shadow-md rounded-b-3xl">
        <div className="flex items-center justify-between mb-4">
          <div className="flex items-center gap-3">
            <div className="w-10 h-10 rounded-2xl bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-amber-400 font-black text-lg">ح</div>
            <div>
              <h1 className="font-black text-lg tracking-wide leading-none">{t.title}</h1>
              <p className="text-[11px] text-stone-300 mt-1">{t.subtitle}</p>
            </div>
          </div>
          <div className="flex items-center gap-2">
            <button onClick={() => setLang(lang === "ar" ? "en" : "ar")}
              className="px-3 h-9 rounded-xl flex items-center justify-center gap-1.5 bg-white/10 hover:bg-white/20 text-white text-xs font-bold transition">
              🌐 {lang === "ar" ? "EN" : "AR"}
            </button>
            <button onClick={() => setView("admin")} className="w-9 h-9 rounded-xl bg-white/10 hover:bg-white/20 flex items-center justify-center text-sm transition">⚙️</button>
          </div>
        </div>

        {(view === "home" || view === "list") && (
          <div className="flex items-center gap-3 bg-white/10 border border-white/15 rounded-2xl px-4 py-3 transition focus-within:bg-white/15 focus-within:border-amber-400/60">
            <span className="text-stone-300">🔍</span>
            <input
              value={query}
              onChange={(e) => { setQuery(e.target.value); setView("list"); }}
              placeholder={t.searchPlaceholder}
              className="bg-transparent outline-none text-sm text-white placeholder-stone-300 w-full"
            />
            {query && <button onClick={() => setQuery("")} className="text-stone-300 text-xs">✕</button>}
          </div>
        )}
      </header>

      {list === null ? (
        <div className="flex-1 flex flex-col items-center justify-center py-32 text-stone-400 gap-3">
          <div className="spinner"></div>
          <span className="text-xs font-bold tracking-wider">{t.loading}</span>
        </div>
      ) : (
        <div className="flex-1 px-4 pt-5 pb-6">
          {view === "home" && (
            <main className="space-y-6">
              <div className="flex gap-2 overflow-x-auto pb-1 hide-scrollbar">
                {[t.all, ...NEIGHBORHOODS.map((h) => h[lang])].map((h, idx) => {
                  const hoodValue = idx === 0 ? t.all : NEIGHBORHOODS[idx - 1].ar;
                  const isActive = activeHood === hoodValue;
                  return (
                    <button key={h} onClick={() => setActiveHood(hoodValue)} 
                      className={`whitespace-nowrap text-xs font-bold px-4 py-2.5 rounded-2xl transition shadow-xs ${
                        isActive ? "bg-[#0F3030] text-white shadow-sm" : "bg-white text-stone-600 border border-stone-200 hover:border-stone-300"
                      }`}>
                      {h}
                    </button>
                  );
                })}
              </div>

              <div>
                <div className="flex items-center justify-between mb-3.5">
                  <h2 className="font-black text-[#0F3030] text-sm">{t.chooseCategory}</h2>
                </div>
                <div className="grid grid-cols-3 gap-3">
                  {CATEGORIES.map((c) => {
                    const count = approved.filter((x) => x.cat === c.id).length;
                    return (
                      <button key={c.id} onClick={() => { setActiveCat(c.id); setView("list"); }} 
                        className="group bg-white p-3.5 rounded-2xl flex flex-col items-center text-center border border-stone-200/80 hover:border-[#0F3030]/40 transition shadow-xs hover:shadow-md">
                        <div className="w-12 h-12 rounded-2xl flex items-center justify-center mb-2 transition transform group-hover:scale-105" style={{ background: c.color + "15", border: `1px solid ${c.color}30` }}>
                          <span style={{ fontSize: 22 }}>{c.icon}</span>
                        </div>
                        <span className="text-xs font-bold text-stone-800 truncate w-full">{c.name[lang]}</span>
                        <span className="text-[10px] text-stone-400 mt-0.5">{count} حرفي</span>
                      </button>
                    );
                  })}
                </div>
              </div>

              <button onClick={() => setView("register")} 
                className="w-full relative overflow-hidden group bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-white p-4 rounded-2xl font-black text-sm flex items-center justify-center gap-3 shadow-md transition transform active:scale-98">
                <span className="w-7 h-7 rounded-xl bg-white/20 flex items-center justify-center text-base">+</span>
                <span>{t.registerCta}</span>
              </button>

              <div>
                <div className="flex items-center justify-between mb-3.5">
                  <h2 className="font-black text-[#0F3030] text-sm">{t.topRated}</h2>
                  <button onClick={() => setView("list")} className="text-xs font-bold text-amber-600 hover:underline">{t.viewAll} →</button>
                </div>
                <div className="space-y-3">
                  {approved.length === 0 ? (
                    <div className="bg-white rounded-2xl p-8 text-center border border-stone-200">
                      <p className="text-xs text-stone-400 font-bold">{t.noCraftsmenYet}</p>
                    </div>
                  ) : (
                    [...approved].sort((a, b) => (b.rating || 0) - (a.rating || 0)).slice(0, 3).map((c) => (
                      <CraftCard key={c.id} c={c} cat={catInfo(c.cat)} lang={lang} t={t} onClick={() => setSelected(c)} />
                    ))
                  )}
                </div>
              </div>
            </main>
          )}

          {view === "list" && (
            <main className="space-y-4">
              <div className="flex items-center gap-3 mb-2">
                <button onClick={() => { setView("home"); setActiveCat(null); setQuery(""); }} 
                  className="w-9 h-9 rounded-xl bg-white border border-stone-200 flex items-center justify-center text-[#0F3030] font-bold shadow-xs">
                  {dir === "rtl" ? "←" : "→"}
                </button>
                <div>
                  <h2 className="font-black text-[#0F3030] text-base">
                    {activeCat ? catInfo(activeCat).name[lang] : t.navSearch}
                  </h2>
                  <p className="text-[11px] text-stone-400">{filtered.length} حرفي متوفر</p>
                </div>
              </div>

              <div className="flex gap-2 overflow-x-auto pb-2 hide-scrollbar">
                <button onClick={() => setActiveCat(null)} 
                  className={`whitespace-nowrap text-xs font-bold px-3.5 py-2 rounded-xl border transition ${!activeCat ? "bg-[#0F3030] text-white border-[#0F3030]" : "bg-white text-stone-600 border-stone-200"}`}>
                  {t.allCrafts}
                </button>
                {CATEGORIES.map((c) => (
                  <button key={c.id} onClick={() => setActiveCat(c.id)} 
                    className={`whitespace-nowrap text-xs font-bold px-3.5 py-2 rounded-xl border transition ${activeCat === c.id ? "bg-[#0F3030] text-white border-[#0F3030]" : "bg-white text-stone-600 border-stone-200"}`}>
                    {c.name[lang]}
                  </button>
                ))}
              </div>

              {filtered.length === 0 ? (
                <div className="bg-white rounded-3xl p-12 text-center border border-stone-200 mt-6 shadow-xs">
                  <div className="text-4xl mb-3">🔍</div>
                  <p className="text-sm font-bold text-stone-700">{t.noResults}</p>
                  <p className="text-xs text-stone-400 mt-1">{t.tryOther}</p>
                </div>
              ) : (
                <div className="space-y-3 pt-1">
                  {filtered.map((c) => <CraftCard key={c.id} c={c} cat={catInfo(c.cat)} lang={lang} t={t} onClick={() => setSelected(c)} />)}
                </div>
              )}
            </main>
          )}

          {view === "register" && (
            <RegisterForm onBack={() => setView("home")} onSubmit={registerCraftsman} saving={saving} uploadingText={uploadingText} t={t} lang={lang} />
          )}

          {view === "admin" && (
            <main className="space-y-4">
              <div className="flex items-center gap-3 mb-2">
                <button onClick={() => setView("home")} className="w-9 h-9 rounded-xl bg-white border border-stone-200 flex items-center justify-center text-[#0F3030] font-bold">
                  {dir === "rtl" ? "←" : "→"}
                </button>
                <h2 className="font-black text-[#0F3030] text-base">{t.adminTitle}</h2>
              </div>

              {!adminUnlocked ? (
                <div className="bg-white rounded-3xl p-6 border border-stone-200 shadow-sm space-y-4">
                  <div className="w-12 h-12 rounded-2xl bg-amber-500/10 text-amber-600 flex items-center justify-center text-xl mb-1">🔒</div>
                  <p className="text-xs text-stone-500 font-bold">{t.adminPinPrompt}</p>
                  <input value={pinInput} onChange={(e) => { setPinInput(e.target.value); setPinError(false); }} type="password"
                    className="w-full border-2 rounded-2xl px-4 py-3 text-sm outline-none transition focus:border-[#0F3030]"
                    style={{ borderColor: pinError ? "#C0392B" : "#E6E2D8" }} placeholder={t.adminPinPlaceholder} />
                  {pinError && <p className="text-[11px] text-red-600 font-bold">{t.adminPinWrong}</p>}
                  <button onClick={() => pinInput === ADMIN_PIN ? setAdminUnlocked(true) : setPinError(true)}
                    className="w-full py-3.5 rounded-2xl font-black text-white text-sm bg-[#0F3030] hover:bg-[#164545] transition shadow-md">
                    {t.adminLogin}
                  </button>
                </div>
              ) : pending.length === 0 ? (
                <div className="bg-white rounded-3xl p-12 text-center border border-stone-200 text-stone-400">
                  <div className="text-3xl mb-2">✨</div>
                  <p className="text-xs font-bold">{t.adminNoPending}</p>
                </div>
              ) : (
                <div className="space-y-4">
                  {pending.map((c) => (
                    <div key={c.id} className="bg-white rounded-3xl p-5 border border-stone-200 shadow-xs space-y-3">
                      <div className="flex items-center justify-between">
                        <span className="font-black text-[#0F3030] text-base">{c.name}</span>
                        <span className="text-[10px] font-bold px-2.5 py-1 rounded-xl bg-amber-50 text-amber-700 border border-amber-200">🕐 {t.pendingLabel}</span>
                      </div>
                      <p className="text-xs text-stone-500 font-bold">{craftName(c, lang)} · {hoodName(c.hood, lang)} · {c.exp} {t.yearsExp}</p>
                      <p className="text-xs text-stone-700 bg-[#F8F7F4] p-3 rounded-2xl leading-relaxed">{c.bio}</p>
                      <p className="text-xs font-mono font-bold text-[#0F3030]" dir="ltr">{c.phone}</p>
                      
                      {c.galleryUrls && c.galleryUrls.length > 0 && (
                        <div>
                          <p className="text-[11px] font-bold text-stone-400 mb-1.5">معرض الأعمال المرفق:</p>
                          <div className="flex gap-2 overflow-x-auto pb-1 hide-scrollbar">
                            {c.galleryUrls.map((url, i) => (
                              <a key={i} href={url} target="_blank" rel="noreferrer">
                                <img src={url} className="w-14 h-14 rounded-xl object-cover border border-stone-200 shrink-0 hover:opacity-90" alt="عمل" />
                              </a>
                            ))}
                          </div>
                        </div>
                      )}

                      <div className="grid grid-cols-2 gap-2.5 pt-2 border-t border-stone-100">
                        <button onClick={() => approveCraftsman(c.id)} className="py-2.5 rounded-xl font-bold text-white text-xs bg-emerald-600 hover:bg-emerald-700 transition shadow-xs">✅ {t.approveBtn}</button>
                        <button onClick={() => rejectCraftsman(c.id)} className="py-2.5 rounded-xl font-bold text-xs border border-stone-200 text-stone-500 hover:bg-stone-50 transition">🗑️ {t.rejectBtn}</button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </main>
          )}
        </div>
      )}

      <nav className="fixed bottom-0 inset-x-0 max-w-lg mx-auto bg-white/95 backdrop-blur-md border-t border-stone-200/80 flex justify-around py-3 px-2 z-30 shadow-lg rounded-t-3xl">
        <button onClick={() => setView("home")} className={`flex flex-col items-center gap-1 transition ${view === "home" ? "text-[#0F3030] scale-105" : "text-stone-400 hover:text-stone-600"}`}>
          <span className="text-xl">🏠</span>
          <span className="text-[10px] font-bold">{t.navHome}</span>
        </button>
        <button onClick={() => setView("list")} className={`flex flex-col items-center gap-1 transition ${view === "list" ? "text-[#0F3030] scale-105" : "text-stone-400 hover:text-stone-600"}`}>
          <span className="text-xl">🔍</span>
          <span className="text-[10px] font-bold">{t.navSearch}</span>
        </button>
        <button onClick={() => setView("register")} className={`flex flex-col items-center gap-1 transition ${view === "register" ? "text-[#0F3030] scale-105" : "text-stone-400 hover:text-stone-600"}`}>
          <span className="text-xl">➕</span>
          <span className="text-[10px] font-bold">{t.navRegister}</span>
        </button>
      </nav>

      {toast && (
        <div className="fixed bottom-24 inset-x-6 z-50 bg-[#0F3030] text-white text-xs font-bold rounded-2xl px-5 py-3.5 text-center shadow-xl border border-white/10 animate-fade-in">
          {toast}
        </div>
      )}

      {selected && (
        <div className="fixed inset-0 z-40 flex items-end justify-center bg-black/50 backdrop-blur-sm animate-fade-in" onClick={() => setSelected(null)}>
          <div onClick={(e) => e.stopPropagation()} className="bg-white rounded-t-3xl w-full max-w-lg p-6 relative max-h-[88vh] overflow-y-auto hide-scrollbar shadow-2xl space-y-5">
            <button onClick={() => setSelected(null)} className="absolute left-5 top-5 w-8 h-8 rounded-full bg-stone-100 flex items-center justify-center text-stone-500 font-bold hover:bg-stone-200">✕</button>
            
            <div className="flex items-start gap-4">
              <div className="w-16 h-16 rounded-2xl flex items-center justify-center shrink-0 shadow-sm" style={{ background: catInfo(selected.cat).color + "15", border: `1.5px solid ${catInfo(selected.cat).color}30` }}>
                <span style={{ fontSize: 30 }}>{catInfo(selected.cat).icon}</span>
              </div>
              <div className="flex-1 min-w-0 pr-6">
                <h3 className="font-black text-[#0F3030] text-lg truncate">{selected.name}</h3>
                <p className="text-xs text-stone-500 font-bold mt-0.5">{craftName(selected, lang)} · {selected.exp} {t.yearsExp}</p>
                <div className="flex items-center gap-2 mt-1.5">
                  <Stars value={selected.rating} />
                  <span className="text-xs font-bold text-stone-700">{selected.rating ? selected.rating.toFixed(1) : t.newLabel} {selected.reviews ? `(${selected.reviews} ${t.reviewsLabel})` : ""}</span>
                </div>
              </div>
              <button onClick={() => shareCraftsman(selected)} className="w-10 h-10 rounded-xl bg-stone-100 flex items-center justify-center text-stone-600 hover:bg-stone-200" title={t.shareBtn}>🔗</button>
            </div>

            <div className="flex items-center gap-2 text-xs font-bold text-stone-500 bg-stone-50 px-3.5 py-2.5 rounded-xl">
              <span>📍</span><span>{hoodName(selected.hood, lang)}</span>
            </div>

            <p className="text-sm text-stone-700 leading-relaxed bg-[#F8F7F4] p-4 rounded-2xl border border-stone-200/60">{selected.bio}</p>

            {selected.galleryUrls && selected.galleryUrls.length > 0 && (
              <div>
                <h4 className="text-xs font-black text-[#0F3030] mb-2.5">{t.galleryTitle}</h4>
                <div className="flex gap-2.5 overflow-x-auto pb-2 hide-scrollbar">
                  {selected.galleryUrls.map((url, i) => (
                    <a key={i} href={url} target="_blank" rel="noreferrer" className="shrink-0">
                      <img src={url} alt={`عمل ${i + 1}`} className="w-28 h-28 object-cover rounded-2xl border border-stone-200 shadow-xs hover:opacity-95 transition" />
                    </a>
                  ))}
                </div>
              </div>
            )}

            <div className="bg-stone-50 rounded-2xl p-4 flex flex-col items-center justify-center gap-2 border border-stone-200/60">
              <span className="text-xs font-bold text-stone-600">{t.rateThis}</span>
              <RatingInput onRate={(v) => rateCraftsman(selected, v)} />
            </div>

            <div className="grid grid-cols-2 gap-3 pt-2">
              <a href={`tel:${selected.phone}`} className="flex items-center justify-center gap-2.5 py-3.5 rounded-2xl font-black text-white text-sm bg-[#0F3030] hover:bg-[#164545] shadow-md transition">
                <span>📞</span><span>{t.call}</span>
              </a>
              <a href={`https://wa.me/213${selected.phone.slice(1)}`} target="_blank" rel="noreferrer" className="flex items-center justify-center gap-2.5 py-3.5 rounded-2xl font-black text-white text-sm bg-emerald-600 hover:bg-emerald-700 shadow-md transition">
                <span>💬</span><span>{t.whatsapp}</span>
              </a>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function RegisterForm({ onBack, onSubmit, saving, uploadingText, t, lang }) {
  const [form, setForm] = useState({ name: "", cat: "plumb", otherCat: "", hood: NEIGHBORHOODS[0].ar, exp: "", phone: "", bio: "" });
  const [files, setFiles] = useState([]);
  const [error, setError] = useState("");
  const update = (k, v) => setForm((f) => ({ ...f, [k]: v }));

  const submit = () => {
    if (!form.name.trim() || !form.phone.trim() || !form.bio.trim()) { setError(t.requiredError); return; }
    if (form.cat === "other" && !form.otherCat.trim()) { setError(t.otherCraftError); return; }
    if (!/^0[5-7][0-9]{8}$/.test(form.phone.trim())) { setError(t.phoneError); return; }
    setError("");
    onSubmit({ ...form, otherCat: form.otherCat.trim(), phone: form.phone.trim(), exp: Number(form.exp) || 0, files });
  };

  return (
    <main className="space-y-4">
      <div className="flex items-center gap-3 mb-2">
        <button onClick={onBack} className="w-9 h-9 rounded-xl bg-white border border-stone-200 flex items-center justify-center text-[#0F3030] font-bold">
          {lang === "ar" ? "←" : "→"}
        </button>
        <h2 className="font-black text-[#0F3030] text-base">{t.registerTitle}</h2>
      </div>

      <div className="bg-white rounded-3xl p-6 border border-stone-200 shadow-sm space-y-4">
        <Field label={t.fullName}><input value={form.name} onChange={(e) => update("name", e.target.value)} className="ipt" placeholder="مثال: أحمد بن محمد" /></Field>
        
        <Field label={t.craft}>
          <select value={form.cat} onChange={(e) => update("cat", e.target.value)} className="ipt">
            {CATEGORIES.map((c) => <option key={c.id} value={c.id}>{c.name[lang]}</option>)}
          </select>
        </Field>

        {form.cat === "other" && (
          <Field label={t.otherCraft}><input value={form.otherCat} onChange={(e) => update("otherCat", e.target.value)} className="ipt" placeholder="اكتب اسم الحرفة هنا" /></Field>
        )}

        <Field label={t.neighborhood}>
          <select value={form.hood} onChange={(e) => update("hood", e.target.value)} className="ipt">
            {NEIGHBORHOODS.map((h) => <option key={h.ar} value={h.ar}>{h[lang]}</option>)}
          </select>
        </Field>

        <Field label={t.experience}><input value={form.exp} onChange={(e) => update("exp", e.target.value.replace(/\D/g, ""))} className="ipt" placeholder="عدد سنوات الخبرة (مثال: 5)" inputMode="numeric" /></Field>
        
        <Field label={t.phone}><input value={form.phone} onChange={(e) => update("phone", e.target.value.replace(/\D/g, ""))} className="ipt" placeholder="0550123456" dir="ltr" inputMode="numeric" /></Field>
        
        <Field label={t.chooseImages}>
          <input type="file" accept="image/*" multiple onChange={(e) => setFiles(Array.from(e.target.files))} className="ipt file:ml-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-[#0F3030] file:text-white hover:file:bg-[#164545] cursor-pointer" />
          <small className="text-[11px] text-stone-400 mt-1.5 block font-bold">{t.galleryNote}</small>
        </Field>

        <Field label={t.bio}><textarea value={form.bio} onChange={(e) => update("bio", e.target.value)} className="ipt" rows="3" placeholder="اكتب تفاصيل خدماتك، أوقات العمل، والمنطقة التي تغطيها..."></textarea></Field>
        
        {error && <p className="text-xs text-red-600 font-bold bg-red-50 p-3 rounded-xl border border-red-200">{error}</p>}
        
        <button onClick={submit} disabled={saving} 
          className="w-full py-4 rounded-2xl font-black text-white text-sm bg-amber-500 hover:bg-amber-600 transition shadow-md flex items-center justify-center gap-2 disabled:opacity-70">
          {saving ? (uploadingText || t.submitting) : t.submitBtn}
        </button>
        
        <p className="text-[11px] text-stone-400 text-center leading-relaxed px-2">{t.reviewNote}</p>
      </div>

      <style>{`
        .ipt { width: 100%; border: 1.5px solid #E6E2D8; border-radius: 16px; padding: 12px 16px; font-size: 14px; outline: none; background: #F8F7F4; font-family: inherit; color: #2D2A26; transition: all 0.2s; } 
        .ipt:focus { border-color: #0F3030; background: white; box-shadow: 0 0 0 3px rgba(15,48,48,0.08); }
      `}</style>
    </main>
  );
}

function Field({ label, children }) {
  return (<div className="space-y-1.5"><label className="text-xs font-black text-[#0F3030] block">{label}</label>{children}</div>);
}

function CraftCard({ c, cat, lang, t, onClick }) {
  return (
    <button onClick={onClick} className="w-full bg-white rounded-2xl p-4 flex items-center gap-3.5 text-start border border-stone-200/80 shadow-xs hover:shadow-md transition group">
      <div className="w-14 h-14 rounded-2xl flex items-center justify-center shrink-0 transition transform group-hover:scale-105" style={{ background: cat.color + "15", border: `1px solid ${cat.color}30` }}>
        <span style={{ fontSize: 24 }}>{cat.icon}</span>
      </div>
      <div className="flex-1 min-w-0">
        <span className="font-black text-[#0F3030] text-sm truncate block">{c.name}</span>
        <p className="text-xs text-stone-500 font-bold truncate mt-0.5">{craftName(c, lang)} · {hoodName(c.hood, lang)}</p>
        <div className="flex items-center gap-2 mt-1.5">
          <Stars value={c.rating} />
          <span className="text-[11px] font-bold text-stone-500">{c.rating ? c.rating.toFixed(1) : t.newLabel}</span>
          {c.galleryUrls && c.galleryUrls.length > 0 && (
            <span className="text-[10px] font-bold text-amber-700 bg-amber-50 px-2 py-0.5 rounded-md border border-amber-200/60">📸 {c.galleryUrls.length}</span>
          )}
        </div>
      </div>
      <div className="w-8 h-8 rounded-full bg-stone-50 flex items-center justify-center text-stone-400 group-hover:bg-[#0F3030] group-hover:text-white transition">
        {dir === "rtl" ? "‹" : "›"}
      </div>
    </button>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
