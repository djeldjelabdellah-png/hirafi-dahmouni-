<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المشرف - منصة حرفي</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f7f6; margin: 0; padding: 30px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #333; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-top: 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: right; border-bottom: 1px solid #ddd; }
        th { background-color: #f8f9fa; color: #333; }
        .btn-approve { background-color: #28a745; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-approve:hover { background-color: #218838; }
        .btn-delete { background-color: #dc3545; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-right: 5px; }
        .btn-delete:hover { background-color: #c82333; }
        .no-data { text-align: center; color: #777; padding: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h2>طلبات الحرفيين بانتظار الموافقة</h2>
    <div id="loading">جاري جلب الطلبات المعلقة...</div>
    
    <table id="craftsmenTable" style="display: none;">
        <thead>
            <tr>
                <th>الاسم الكامل</th>
                <th>رقم الهاتف</th>
                <th>التخصص</th>
                <th>تاريخ التسجيل</th>
                <th>الإجراءات</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- سيتم تعبئة البيانات ديناميكياً عبر JavaScript -->
        </tbody>
    </table>
</div>

<script>
    // تهيئة اتصال Supabase (نفس المفاتيح المستخدمة في مشروعك)
    const SUPABASE_URL = 'https://YOUR_PROJECT_ID.supabase.co';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // جلب الطلبات المعلقة فور فتح الصفحة
    window.onload = function() {
        fetchPendingCraftsmen();
    };

    async function fetchPendingCraftsmen() {
        const loadingEl = document.getElementById('loading');
        const tableEl = document.getElementById('craftsmenTable');
        const tbodyEl = document.getElementById('tableBody');

        // جلب الحرفيين الذين لم يتم اعتمادهم بعد
const { data, error } = await supabase
    .from('craftsmen')
    .select('*')
    .eq('status', 'pending')
    .order('created_at', { ascending: false });

loadingEl.style.display = 'none';

if (error) {
    alert('حدث خطأ أثناء جلب البيانات: ' + error.message);
    return;
}

        if (data.length === 0) {
            loadingEl.style.display = 'block';
            loadingEl.innerText = 'لا توجد طلبات معلقة حالياً.';
            return;
        }

        tableEl.style.display = 'table';
        tbodyEl.innerHTML = '';

        // تكرار البيانات وعرضها في الجدول
        data.forEach(craftsman => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${craftsman.full_name}</td>
                <td>${craftsman.phone}</td>
                <td>${craftsman.specialty}</td>
                <td>${new Date(craftsman.created_at).toLocaleDateString('ar-DZ')}</td>
                <td>
                    <button class="btn-approve" onclick="approveCraftsman('${craftsman.id}')">موافقة ونشر</button>
                    <button class="btn-delete" onclick="deleteCraftsman('${craftsman.id}')">رفض وحذف</button>
                </td>
            `;
            tbodyEl.appendChild(row);
        });
    }

    // دالة الموافقة على الحرفي
    async function approveCraftsman(id) {
        if (!confirm('هل أنتแน่ من موافقتك على نشر هذا الحرفي في المنصة؟')) return;

        const { error } = await supabase
            .from('craftsmen')
            .update({ is_approved: true }) // تحويل حالة الاعتماد إلى صحيح
            .eq('id', id);

        if (error) {
            alert('فشل تحديث الحالة: ' + error.message);
        } else {
            alert('تمت الموافقة بنجاح وأصبح الحرفي ظاهراً للعامة!');
            fetchPendingCraftsmen(); // إعادة تحميل القائمة
        }
    }

    // دالة رفض وحذف الطلب غير المرغوب فيه
    async function deleteCraftsman(id) {
        if (!confirm('هل أنت متأكد من رفض وحذف هذا الطلب نهائياً؟')) return;

        const { error } = await supabase
            .from('craftsmen')
            .delete()
            .eq('id', id);

        if (error) {
            alert('فشل الحذف: ' + error.message);
        } else {
            alert('تم حذف الطلب بنجاح.');
            fetchPendingCraftsmen(); // إعادة تحميل القائمة
        }
    }
</script>

</body>
</html>
